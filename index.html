<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قصة سامي — A1 كاملاً + مكتبة المقالات</title>
<meta name="theme-color" content="#0A211F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="قصة سامي">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Cairo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Firebase (اختياري) — للحفظ السحابي التلقائي ولوحة الإدارة. يفشل بصمت وبلا ضرر إن لم يوجد اتصال أو لم يُضبط FIREBASE_CONFIG بعد. -->
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js" defer onerror="window.__fbLoadFailed=true"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js" defer onerror="window.__fbLoadFailed=true"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js" defer onerror="window.__fbLoadFailed=true"></script>
<style>
:root{
  --deep:#11302E; --deep2:#0A211F; --deep3:#1B4340;
  --paper:#F7EBD5; --paper2:#EFDFC3;
  --ink:#26201A; --muted:#7A6A55;
  --saffron:#E5A22B; --leaf:#2E7D6F; --plum:#8C3A56;
  --r:18px;
  --ar:'Cairo',system-ui,'Segoe UI',sans-serif;
  --en:'Lexend',system-ui,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
/* مظهر فاتح اختياري — يبدّل نفس متغيرات الألوان لقراءة أريح تحت إضاءة قوية */
html[data-theme="light"]{
  --deep:#F7EBD5; --deep2:#EFDFC3; --deep3:#F2E2C4;
  --paper:#26201A; --paper2:#FFF8EA;
  --ink:#26201A; --muted:#7A6A55;
}
html[data-theme="light"] body{background:var(--deep);color:var(--ink)}
html[data-theme="light"] .chip{background:#FFF8EA;border-color:#E2CFA9;color:#26201A}
html[data-theme="light"] .chip b{color:#8C6A1E}
/* حجم خط أكبر لضعاف البصر أو من يفضّل قراءة أوضح — يكبّر الصفحة كاملة دون كسر التخطيط */
html[data-fontsize="large"] body{zoom:1.16}
html[data-fontsize="xlarge"] body{zoom:1.32}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1100px 600px at 50% -10%,#1B4340 0%,transparent 60%),var(--deep);
  color:var(--paper);font-family:var(--ar);min-height:100vh;padding-bottom:92px;
}
.en{direction:ltr;text-align:left;font-family:var(--en)}
.ipa{font-family:var(--mono);color:var(--muted);font-size:.8em;direction:ltr;display:inline-block}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--deep2) 72%,rgba(10,33,31,0));backdrop-filter:blur(6px);padding:10px 0 14px}
.bar{display:flex;align-items:center;gap:8px}
.brand{font-weight:700;font-size:15px}
.brand small{display:block;font-weight:400;font-size:11px;color:#8FBDB6}
.spacer{flex:1}
.chip{border:1px solid #2F5F5A;background:#153E3B;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:600;color:#CFEAE5;display:flex;align-items:center;gap:5px}
.chip b{color:var(--saffron)}
.dots{display:flex;gap:4px;margin-top:12px}
.dot{flex:1;height:5px;border-radius:99px;background:#22514D}
.dot.done{background:var(--saffron)}
.dot.now{background:var(--paper)}

.hero{padding:22px 0 6px}
.hero h1{font-size:clamp(24px,6.5vw,36px);line-height:1.3;margin:0 0 8px}
.hero h1 span{color:var(--saffron)}
.hero p{color:#9FC7C1;margin:0;font-size:13.5px;line-height:1.9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:#153E3B;border:1px solid #275C57;border-radius:14px;padding:11px 8px;text-align:center}
.stat .n{font-family:var(--mono);font-size:22px;color:var(--saffron);font-weight:500}
.stat .l{font-size:10.5px;color:#8FBDB6;margin-top:2px}

.unit-h{font-size:12px;color:var(--saffron);font-weight:700;margin:22px 0 8px;letter-spacing:.02em}
.grid{display:grid;gap:10px}
.card-ch{display:flex;align-items:center;gap:12px;text-align:right;width:100%;background:#153E3B;border:1px solid #275C57;border-radius:var(--r);padding:11px;transition:transform .15s,border-color .15s}
.card-ch:hover{transform:translateY(-2px);border-color:var(--saffron)}
.card-ch.lock{opacity:.5}
.thumb{width:58px;height:58px;border-radius:14px;flex:0 0 auto;display:grid;place-items:center;font-size:27px}
.card-ch .meta{flex:1;min-width:0}
.card-ch .num{font-family:var(--mono);font-size:10.5px;color:var(--saffron);letter-spacing:.1em}
.card-ch h3{margin:2px 0 3px;font-size:15.5px}
.card-ch .sub{font-size:11.5px;color:#8FBDB6;direction:ltr;text-align:left;font-family:var(--en)}
.tick{font-size:12px;color:var(--saffron);font-weight:700;flex:0 0 auto}

.plate{position:relative;height:180px;border-radius:var(--r);overflow:hidden;border:1px solid #2F5F5A;margin-top:6px}
.plate .ground{position:absolute;inset:auto 0 0 0;height:26%}
.plate .it{position:absolute;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.caption{font-size:12px;color:#8FBDB6;text-align:center;margin-top:8px;border-top:1px solid #23514D;padding-top:8px}

.sheet{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:16px 14px;margin-top:14px;box-shadow:0 18px 40px -20px rgba(0,0,0,.7)}
.sheet h2{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;color:#4A3D2E}
.sheet h2 i{width:26px;height:26px;border-radius:8px;background:var(--saffron);display:grid;place-items:center;font-style:normal;font-size:14px;color:#3A2A10;flex:0 0 auto}

.line{display:block;width:100%;text-align:right;padding:10px;border-radius:12px;border:1px solid transparent;transition:background .18s;margin-bottom:2px}
.line:hover{background:var(--paper2)}
.line.active{background:#FFF6E3;border-color:var(--saffron)}
.line .txt{font-family:var(--en);direction:ltr;text-align:left;font-size:17.5px;line-height:1.65;font-weight:500}
.line .ar{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.7}
.w{border-radius:5px;padding:2px 2px;margin:0 -1px;display:inline-block;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.w.on{background:var(--saffron);color:#2A1E05}
.w.gramHi{background:#D9E6FA;color:#1D3A66;font-weight:700;box-shadow:0 0 0 1px #9FBBE8}
html[data-theme="light"] .w.gramHi{background:#2A4A7C;color:#EAF1FF;box-shadow:0 0 0 1px #1D3A66}
.tools{display:flex;gap:7px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.btn{border-radius:999px;padding:9px 15px;font-size:13px;font-weight:700;background:var(--deep3);color:var(--paper)}
.btn.sm{padding:7px 12px;font-size:12px}
.btn.gold{background:var(--saffron);color:#33240A}
.btn.ghost{background:transparent;border:1px solid #CDB68E;color:#6B5A42}
.btn.wide{width:100%;text-align:center;padding:14px}
.btn:disabled{opacity:.45;cursor:default}
.rate{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
input[type=range]{accent-color:var(--saffron);width:88px}

.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.vc{background:var(--paper2);border-radius:12px;padding:9px 10px;text-align:right;border:1px solid #E2CFA9}
.vc .e{font-family:var(--en);direction:ltr;text-align:left;font-weight:600;font-size:14.5px}
.vc .a{font-size:12px;color:var(--muted);margin-top:2px}

/* بطاقات مفردات قابلة للقلب — بطاقة فعلية (front/back) بدل إظهار المعنى مباشرة.
   ملاحظة مهمة: لا نعتمد على تحويلات CSS ثلاثية الأبعاد (rotateY/perspective/backface-visibility) لأن هذه
   التقنية تحتاج تسريع الرسوميات (GPU) وتفشل بصمت (تبقى البطاقة ثابتة كأن الضغط لا يعمل) على أجهزة/متصفحات
   كثيرة (أجهزة قديمة، أجهزة افتراضية، سطح مكتب بعيد RDP، تسريع رسوميات معطّل). بدلاً من ذلك نستخدم إظهار/إخفاء
   بسيط (display) بين الوجهين مع حركة انتقال خفيفة (تكبير+تلاشي) — تعمل مضمونة على أي جهاز أو متصفح.
   الوجه الأمامي (vc-f) يحدّد ارتفاع البطاقة تلقائياً حسب طول نصّه. عند القلب يختفي تماماً (display:none) ويظهر
   الوجه الخلفي (vc-b) بدلاً عنه — فلا تداخل ولا مشاكل نقر إطلاقاً لأن العنصر المخفي لا يُرسَم ولا يستقبل نقرات. */
.vocab.flip{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));align-items:stretch;gap:10px}
.vc-card{background:transparent;border:0;padding:0;display:block;height:auto;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.vc-in{position:relative;width:100%;min-height:84px}
.vc-f,.vc-b{border-radius:16px;padding:12px 11px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;min-height:84px;
  box-shadow:0 3px 10px -4px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.04) inset;
  animation:vcPop .22s ease}
@keyframes vcPop{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}
.vc-f{background:linear-gradient(160deg,var(--paper2),var(--paper));border:1.5px solid #E2CFA9}
.vc-f .e{font-family:var(--en);direction:ltr;font-weight:700;font-size:14.5px;line-height:1.35}
.vc-f .ipa{font-size:10.5px;color:var(--muted);opacity:.85}
.vc-f .tap{font-size:9.5px;color:#B9862F;margin-top:3px;font-weight:700;letter-spacing:.2px}
.vc-f .tap::before{content:"🔄 "}
.vc-b{display:none;background:linear-gradient(155deg,var(--leaf),#164A41);color:#EAF7F2}
.vc-card.flipped .vc-f{display:none}
.vc-card.flipped .vc-b{display:flex}
.vc-b .a{font-size:14.5px;font-weight:700;line-height:1.4}
.vc-b .more{font-size:10px;margin-top:5px;opacity:.9;text-decoration:underline;text-underline-offset:2px}
.vc-card:active .vc-f,.vc-card:active .vc-b{filter:brightness(.96)}

/* شريط خطوات الدرس — دوائر قابلة للضغط للتنقّل المباشر بين أقسام الفصل، مع علامة إنجاز */
.stepper{display:flex;gap:6px;margin-top:12px;overflow-x:auto;padding-bottom:2px}
.step-dot{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--paper2);border:1.5px solid #E2CFA9;color:var(--muted);font-size:16px;display:grid;place-items:center;transition:transform .2s,background .2s,color .2s,border-color .2s}
.step-dot.done{background:var(--leaf);border-color:var(--leaf);color:#EAF7F2}
.step-dot.cur{background:var(--saffron);border-color:var(--saffron);color:#33240A;transform:scale(1.14);box-shadow:0 4px 12px -2px rgba(229,162,43,.6)}

/* انتقال انزلاقي بسيط بين خطوات الدرس — بلا مكتبات خارجية */
.stepslide{animation:stepIn .38s cubic-bezier(.2,.7,.3,1)}
@keyframes stepIn{from{opacity:0;transform:translateX(var(--dir,20px))}to{opacity:1;transform:translateX(0)}}
.hero-step{text-align:center}
.hero-step .caption{text-align:center}

/* مخطط زمني بصري بسيط (ترميز مزدوج) لفصول الأزمنة — يوضح موقع القاعدة على خط الماضي/الحاضر/المستقبل */
.tline{margin:10px 0 4px}
.tline-bar{display:flex;background:#0A211F;border-radius:12px;overflow:hidden;height:56px}
.tz{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:#5A7D78;transition:background .2s,color .2s;border-inline-end:1px solid rgba(255,255,255,.08)}
.tz:last-child{border-inline-end:0}
.tz.on{background:var(--saffron);color:#33240A;font-weight:700}

/* فقاعات محادثة تفاعلية */
.chatlog{display:flex;flex-direction:column;gap:8px;max-height:none}
.bub{max-width:82%;padding:9px 13px;border-radius:16px;font-family:var(--en);direction:ltr;text-align:left;font-size:14px;line-height:1.6}
.bub.a{align-self:flex-start;background:var(--paper2);border:1px solid #E2CFA9;border-bottom-left-radius:4px}
.bub.b{align-self:flex-end;background:var(--deep3);color:var(--paper);border-bottom-right-radius:4px}
.bub.b.ok{background:#1B5B4F;color:#EAF7F2}
.bub.b.no{background:#6E2A3F;color:#FFE6EE}

/* احتفال بسيط عند إنهاء الفصل بدرجة عالية — قصاصات ورق CSS بلا مكتبات خارجية */
.confetti-wrap{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:200}
.confetti-piece{position:absolute;top:-12px;width:8px;height:14px;opacity:.9;animation:confetti-fall linear forwards;border-radius:2px}
@keyframes confetti-fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}

.gtable{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.gtable td{border-bottom:1px solid #E2CFA9;padding:8px 6px}
.gtable td:first-child{font-family:var(--en);direction:ltr;font-weight:600}
.note{background:#FFF6E3;border-right:3px solid var(--saffron);padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.9;color:#5A4A34}
.tip-list{margin:0;padding-right:20px;font-size:13px;line-height:1.9;color:#3A3A3A}
.tip-list li{margin-bottom:10px}
.tip-panel{font-size:13px}

.pg{margin-bottom:10px}
.pg .lab{font-family:var(--mono);font-size:12.5px;color:var(--plum);font-weight:500;margin-bottom:6px;direction:ltr;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{font-family:var(--en);direction:ltr;background:var(--paper2);border:1px solid #E2CFA9;border-radius:99px;padding:6px 12px;font-size:14px;font-weight:500;color:var(--ink)}

.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pbar{flex:1;height:6px;background:#E2CFA9;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--leaf);transition:width .3s}
.qcount{font-family:var(--mono);font-size:12px;color:var(--muted)}
.qtype{font-size:11px;font-weight:700;color:#8C6A1E;background:#FFF0CD;padding:4px 10px;border-radius:99px;display:inline-block}
.qtext{font-size:17px;line-height:1.8;margin:8px 0 4px;white-space:pre-line}
.qtext.en{font-size:18px;font-weight:600}
.qhint{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.8}
.opts{display:grid;gap:9px}
.opt{text-align:right;padding:13px 14px;border-radius:12px;background:var(--paper2);border:1.5px solid #E2CFA9;font-size:16px;font-weight:600;color:var(--ink)}
.opt .en{font-size:16px;display:block}
.opt.ok{background:#DCF0E7;border-color:var(--leaf);color:#1B5B4F}
.opt.no{background:#F6DDE3;border-color:var(--plum);color:#6E2A3F}
.fb{margin-top:12px;padding:11px 13px;border-radius:12px;font-size:14px;line-height:1.8;font-weight:600}
.fb-exp{margin-top:8px;font-size:12.5px;font-weight:400;line-height:1.8;color:inherit;opacity:.92;border-top:1px dashed rgba(0,0,0,.12);padding-top:8px}
.fb.ok{background:#DCF0E7;color:#1B5B4F}
.fb.no{background:#F6DDE3;color:#6E2A3F}
.fb .en{font-weight:700;display:inline}

.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mcell{padding:13px 8px;border-radius:12px;background:var(--paper2);border:1.5px solid #E2CFA9;font-size:15px;font-weight:600;text-align:center;min-height:50px;width:100%;margin-bottom:9px}
.mcell.sel{border-color:var(--saffron);background:#FFF0CD}
.mcell.done{opacity:.35;pointer-events:none;background:#DCF0E7;border-color:var(--leaf)}
.mcell.bad{border-color:var(--plum);background:#F6DDE3}

.slot{min-height:56px;border:1.5px dashed #CDB68E;border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;direction:ltr;align-content:flex-start;margin-bottom:10px}
.pool{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.tok{font-family:var(--en);background:var(--paper2);border:1px solid #E2CFA9;border-radius:9px;padding:8px 12px;font-size:15px;font-weight:500;color:var(--ink)}
.tok.in{background:var(--deep3);color:var(--paper);border-color:var(--deep3)}

.tin{width:100%;padding:14px;border-radius:12px;border:1.5px solid #CDB68E;background:#fff;font-family:var(--en);direction:ltr;font-size:18px;font-weight:500;color:var(--ink);text-align:center}
.tin:focus{outline:2px solid var(--saffron);border-color:var(--saffron)}
.fin{width:100%;padding:12px;border-radius:12px;border:1.5px solid #CDB68E;background:#fff;font-size:15px;color:var(--ink);text-align:right}

.score{text-align:center;padding:10px 0 4px}
.score .big{font-family:var(--mono);font-size:44px;font-weight:500;color:var(--leaf)}
.score .lab{font-size:13px;color:var(--muted)}

.ul-item{display:flex;align-items:center;gap:10px;background:var(--paper2);border:1px solid #E2CFA9;border-radius:12px;padding:10px;margin-bottom:8px}
.ul-item .t{flex:1;min-width:0}
.ul-item .t .e{font-family:var(--en);direction:ltr;text-align:left;font-weight:600;font-size:15px;word-break:break-word}
.ul-item .t .a{font-size:12px;color:var(--muted)}
.ul-item .lv{font-family:var(--mono);font-size:10px;color:var(--leaf);margin-top:2px;direction:ltr;text-align:left}
.icobtn{width:38px;height:38px;border-radius:11px;background:var(--deep3);color:var(--paper);flex:0 0 auto;font-size:15px}
.icobtn.p{background:#E7D2AC;color:#5A4A34}

.banner{background:#FFF0CD;border:1px solid var(--saffron);color:#5A4A34;border-radius:14px;padding:12px 13px;font-size:13px;line-height:1.9;margin-top:12px}
.banner b{color:#8C6A1E}
.diag{font-family:var(--mono);font-size:11px;color:var(--muted);direction:ltr;text-align:left;margin-top:8px;line-height:1.7}
.mic{width:74px;height:74px;border-radius:50%;background:var(--plum);color:#fff;font-size:28px;display:grid;place-items:center;margin:14px auto;box-shadow:0 10px 24px -10px rgba(140,58,86,.8)}
.mic.live{background:var(--leaf);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.bigword{font-family:var(--en);direction:ltr;text-align:center;font-size:32px;font-weight:700;margin:8px 0 2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ava{width:46px;height:46px;border-radius:50%;background:var(--saffron);color:#33240A;display:grid;place-items:center;font-size:20px;font-weight:700;flex:0 0 auto}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:14px;line-height:1.9}


/* ===== خريطة الدروس ===== */
.map{padding:6px 0 40px;position:relative}
.unitbar{background:linear-gradient(135deg,var(--deep3),#16403C);border:1px solid #2F5F5A;
  border-radius:18px;padding:13px 15px;margin:26px 0 22px;display:flex;align-items:center;gap:12px}
.unitbar .ub-i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.unitbar .ub-t{flex:1;min-width:0}
.unitbar .ub-n{font-family:var(--mono);font-size:10px;color:var(--saffron);letter-spacing:.1em}
.unitbar h3{margin:2px 0 0;font-size:14.5px;line-height:1.4}
.unitbar .ub-p{font-family:var(--mono);font-size:12px;color:#8FBDB6;flex:0 0 auto}

.nrow{display:flex;justify-content:center;position:relative;height:104px}
.ncol{position:absolute;top:0;display:flex;flex-direction:column;align-items:center;width:130px}
.node{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:30px;
  position:relative;background:var(--saffron);color:#33240A;box-shadow:0 6px 0 #A6741A;
  transition:transform .1s,box-shadow .1s;border:3px solid rgba(255,255,255,.18)}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 #A6741A}
.node.done{background:var(--leaf);color:#EAF7F2;box-shadow:0 6px 0 #1C574C}
.node.done:active{box-shadow:0 2px 0 #1C574C}
.node.lock{background:#20504C;color:#4E7D77;box-shadow:0 6px 0 #163C39;border-color:rgba(255,255,255,.06)}
.node.lock:active{box-shadow:0 2px 0 #163C39}
.node.chest{border-radius:24px;background:var(--plum);color:#FFE6EE;box-shadow:0 6px 0 #632338}
.node.chest:active{box-shadow:0 2px 0 #632338}
.node.chest.lock{background:#20504C;color:#4E7D77;box-shadow:0 6px 0 #163C39}
.node.now{animation:ring 1.8s infinite}
@keyframes ring{0%,100%{box-shadow:0 6px 0 #A6741A,0 0 0 0 rgba(229,162,43,.5)}
  50%{box-shadow:0 6px 0 #A6741A,0 0 0 12px rgba(229,162,43,0)}}
.nstars{margin-top:5px;font-size:11px;letter-spacing:2px;color:var(--saffron);height:14px}
.nstars .off{color:#2C5B56}
.nlab{margin-top:1px;font-size:11px;color:#9FC7C1;text-align:center;line-height:1.45;
  max-width:124px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bub{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--paper);
  color:#1B4340;font-size:10.5px;font-weight:700;padding:5px 12px;border-radius:99px;white-space:nowrap;
  animation:bob 1.5s ease-in-out infinite;box-shadow:0 4px 10px -4px rgba(0,0,0,.6)}
.bub:after{content:"";position:absolute;bottom:-4px;left:50%;margin-inline-start:-4px;
  border-left:5px solid transparent;border-right:5px solid transparent;border-top:5px solid var(--paper)}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
.conn{position:absolute;width:9px;height:9px;border-radius:50%;background:#22514D}

.toast{position:fixed;inset:auto 20px 96px 20px;z-index:70;background:var(--paper);color:#3A3026;
  border-radius:14px;padding:12px 15px;font-size:13px;font-weight:600;text-align:center;
  box-shadow:0 14px 34px -14px rgba(0,0,0,.8)}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ===== قارئ الجمل بكلمات قابلة للنقر ===== */
.rdr{margin-top:4px}
.rline{display:flex;gap:9px;align-items:flex-start;padding:9px 8px;border-radius:12px;
  border:1px solid transparent;margin-bottom:3px}
.rline.active{background:#FFF6E3;border-color:var(--saffron)}
.playb{width:34px;height:34px;border-radius:10px;background:var(--deep3);color:var(--paper);
  font-size:12px;flex:0 0 auto;margin-top:2px}
.rbody{flex:1;min-width:0}
.rtxt{font-family:var(--en);direction:ltr;text-align:left;font-size:17px;line-height:1.75;font-weight:500;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.gtable td,.note,.qtext,.fb,.bigword,.pg .lab,.exp-text,.qhint-en{
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.rtxt .w,.qtext .w,.opts .w{border-radius:5px;padding:1px 2px;cursor:pointer;border-bottom:1px dotted #C4AE86}
.rtxt .w:active{background:var(--paper2)}
.rtxt .w.on{background:var(--saffron);color:#2A1E05;border-bottom-color:transparent}
.rar{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.7}
.rhint{font-size:11.5px;color:var(--muted);text-align:center;margin-top:10px;
  border-top:1px solid #E2CFA9;padding-top:9px}

/* ===== نافذة الكلمة ===== */
.veil{position:fixed;inset:0;background:rgba(6,20,19,.62);z-index:80}
.wpop{position:fixed;inset:auto 12px 12px 12px;z-index:81;background:var(--paper);color:var(--ink);
  border-radius:20px;padding:16px 15px calc(16px + env(safe-area-inset-bottom));
  max-height:78vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  box-shadow:0 -10px 40px -10px rgba(0,0,0,.8);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
.wp-h{display:flex;align-items:center;gap:10px}
.wp-w{font-family:var(--en);direction:ltr;text-align:left;font-size:26px;font-weight:700}
.wp-m{margin-top:10px;background:var(--paper2);border-radius:12px;padding:11px 12px;font-size:15px;line-height:1.8}
.wp-o{margin-top:8px;font-size:12px;color:var(--muted)}
.wp-auto{margin-top:6px;font-size:10.5px;color:var(--muted);opacity:.8}

/* ===== أزرار التصنيف ===== */
.segs{display:flex;flex-wrap:wrap;gap:6px}
.seg{border:1px solid #2F5F5A;background:#153E3B;color:#CFEAE5;border-radius:99px;
  padding:8px 13px;font-size:12.5px;font-weight:600}
.seg.sm{padding:6px 11px;font-size:11.5px}
.seg.on{background:var(--saffron);color:#33240A;border-color:var(--saffron)}
.sheet .seg{border-color:#CDB68E;background:var(--paper2);color:#5A4A34}
.sheet .seg.on{background:var(--saffron);color:#33240A;border-color:var(--saffron)}

/* ===== تصحيح الكتابة ===== */
.dline{margin-top:8px;font-family:var(--en);direction:ltr;text-align:left;font-size:17px;line-height:1.9}
.dw,.dc{border-radius:5px;padding:1px 4px;margin:0 1px;display:inline-block}
.dw.ok,.dc.ok{background:#BFE6D5;color:#14503F}
.dw.bad,.dc.bad{background:#F3C6D1;color:#6E2A3F}
.dc{padding:1px 3px;font-weight:600}
textarea.tin{resize:vertical;text-align:left;line-height:1.6}

/* كلمات قابلة للنقر في كل مكان */
.tw{border-radius:4px;padding:1px 2px;margin:0 -1px;cursor:pointer;display:inline-block;
  border-bottom:1px dotted rgba(122,106,85,.45);-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.tw:active{background:var(--saffron);color:#2A1E05}
.note .tw,.gtable .tw{border-bottom-color:rgba(122,106,85,.4)}
.fb .tw{border-bottom-color:currentColor;opacity:1}

/* رفع الصف المحدَّث إلى الأعلى */
.ul-item.lift{animation:lift .7s ease-out}
@keyframes lift{0%{background:var(--saffron);transform:scale(1.015)}
  60%{background:#FFF0CD}100%{background:var(--paper2);transform:scale(1)}}

nav{position:fixed;inset:auto 0 0 0;z-index:50;background:var(--deep2);border-top:1px solid #22514D;display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
@media print{
  header,nav,.btn,.no-print{display:none !important}
  body{background:#fff !important;color:#111 !important;padding-bottom:0 !important}
  .sheet{background:#fff !important;border:1px solid #ccc !important;color:#111 !important;box-shadow:none !important;break-inside:avoid}
  .note{color:#333 !important}
  .wrap,.app-wrap{max-width:100% !important}
}
nav button{flex:1;padding:8px 1px;border-radius:12px;font-size:9.5px;color:#7FB0AA;font-weight:600;position:relative}
nav button .i{display:block;font-size:18px;margin-bottom:2px}
nav button.on{color:var(--saffron);background:#153E3B}
nav .bdg{position:absolute;top:2px;inset-inline-end:14px;background:var(--plum);color:#fff;font-size:9px;font-family:var(--mono);border-radius:99px;padding:1px 5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
</style>

/* ============ فهرس الكلمات الشامل ============ */
var WORDS={};       /* كلمة → {t, ar, ipa} */
var SENTS=[];       /* كل الجمل: {en, ar, src, key} */

function wkey(s){ return String(s).toLowerCase().replace(/[^a-z']/g,''); }
function addW(t,ar,ipa){
  const full=String(t).toLowerCase().trim();
  if(!WORDS[full]) WORDS[full]={t:t,ar:ar,ipa:ipa||''};
  /* افهرس كل كلمة مفردة داخل المدخل: go → went يصبح go و went */
  String(t).split(/[^A-Za-z']+/).forEach(tok=>{
    const k=wkey(tok);
    if(k&&k.length>1&&!WORDS[k]) WORDS[k]={t:tok,ar:ar,ipa:ipa||''};
  });
}
function buildIndex(){
  BOOK.forEach((c,i)=>{
    c.vocab.forEach(v=>addW(v[0],v[1],v[2]));
    c.lines.forEach((l,n)=>SENTS.push({en:l[0],ar:l[1],src:c.t_ar,ci:i,key:'c'+i+'-'+n}));
  });
  CATS.forEach(cat=>(LIB[cat.k]||[]).forEach((raw,n)=>{
    const a=parseArt(raw);
    a.W.forEach(w=>addW(w[0],w[1],''));
    a.L.forEach((l,m)=>SENTS.push({en:l[0],ar:l[1],src:a.a,ci:-1,key:cat.k+n+'-'+m}));
  }));
  /* فهرسة مفردات قطع الكفاءة/الاختبار الوطني لتفعيل الترجمة عند النقر */
  (EXAM.passages||[]).forEach(p=>{ (p.vocab||[]).forEach(v=>addW(v[0],v[1],'')); });
  /* قاموس شامل لمفردات أسئلة الكفاءة بجميع أنواعها — يعمل بلا اتصال بالإنترنت */
  (typeof EXAM_DICTIONARY!=='undefined'?EXAM_DICTIONARY:[]).forEach(v=>addW(v[0],v[1],''));
  /* معرّف ثابت لكل سؤال في كل بنك — يُستخدم لحفظ حالة (صحيح/خطأ/لم يُختبر) بشكل دائم */
  const _idPfx={grammar:'g',direct:'d',functions:'f',idioms:'i',dialogues:'dl'};
  Object.keys(_idPfx).forEach(k=>(EXAM[k]||[]).forEach((q,i)=>{ q._id=_idPfx[k]+i; }));

function lookup(word){
  const k=wkey(word);
  return WORDS[k]||WORDS[k.replace(/s$/,'')]||WORDS[k.replace(/es$/,'')]||
         WORDS[k.replace(/ed$/,'')]||WORDS[k.replace(/ing$/,'')]||null;
}
function isKnown(w){ return !!(S.known&&S.known[wkey(w)]); }
function inReview(w){ return !!S.cards[wkey(w)]; }
/* معرفة/عدم معرفة الجُمل — منفصلة عن المفردات المفردة، حتى لو لم تُضَف الجملة للمراجعة بعد */
function isSentKnown(en){ return !!(S.sentKnown&&S.sentKnown[cardKey(en)]); }

/* ترجمة تلقائية عبر الإنترنت للكلمات غير الموجودة في القاموس المحلي فقط —
   ذاكرة مؤقتة في الجلسة الحالية (RAM) ولا تُحفظ إطلاقاً في التخزين المحلي أو أي ملف؛
   تُستخدم فقط لعرض معنى مؤقت داخل النافذة المنبثقة، ولا تدخل أبداً إلى «قاموسي» المحفوظ. */
var NET_TR_CACHE={};
function autoTranslate(word, onDone){
  const k=wkey(word);
  if(NET_TR_CACHE[k]) return onDone(NET_TR_CACHE[k]);
  fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(word)+'&langpair=en|ar')
    .then(r=>r.json())
    .then(d=>{
      let tr = d && d.responseData && d.responseData.translatedText;
      if(tr) tr = tr.trim();
      if(tr && tr.toLowerCase()!==word.toLowerCase() && !/no query|invalid/i.test(tr)){
        NET_TR_CACHE[k]=tr; onDone(tr);
      } else onDone(null);
    })
    .catch(()=>onDone(null, true));
}

function wordPopup(raw){

function gramHighlightWords(ch){
  const set=new Set();
  if(!ch||!ch.gram||!ch.gram.rows) return set;
  ch.gram.rows.forEach(r=>{
    String(r[0]||'').split(/[\/,]/).forEach(part=>{
      part.trim().split(/\s+/).forEach(w=>{
        const clean=w.replace(/[^A-Za-z']/g,'').toLowerCase();
        if(clean.length>=2) set.add(clean);
      });
    });
  });
  return set;
}
function readerHTML(lines,hiSet){
  return '<div class="rdr">'+lines.map((l,i)=>
    '<div class="rline" data-i="'+i+'">'+

      l[0].split(' ').map(w=>{
        const clean=w.replace(/[^A-Za-z']/g,'').toLowerCase();
        const hi=hiSet&&hiSet.has(clean);
        return '<span class="w'+(hi?' gramHi':'')+'" data-word="'+esc(w)+'">'+esc(w)+'</span>';
      }).join(' ')+
    '</div><div class="rar">'+l[1]+'</div></div></div>').join('')+'</div>'+
    '<div class="rhint">اضغط ▶ لسماع الجملة · اضغط أي كلمة لمعناها وإضافتها'+
    (hiSet&&hiSet.size?' · <span class="gramHi" style="padding:1px 5px;border-radius:4px">هكذا</span> تُبرَز صيغة قاعدة هذا الفصل':'')+'</div>';
}

function wireReader(host, lines, opts){
  opts=opts||{};
  const rows=[...host.querySelectorAll('.rline')];
  function readLine(i,after){
    stopSpeak();
    rows.forEach(e=>e.classList.remove('active'));
    host.querySelectorAll('.w.on').forEach(e=>e.classList.remove('on'));
    const el=rows[i]; if(!el) return;
    el.classList.add('active');
    try{el.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}
    const ws=[...el.querySelectorAll('.w')], text=lines[i][0];
    const starts=[]; let p=0;
    text.split(' ').forEach(w=>{starts.push(p);p+=w.length+1;});
    speak(text,{onword:idx=>{
        let k=0; for(let n=0;n<starts.length;n++) if(idx>=starts[n]) k=n;
        ws.forEach(w=>w.classList.remove('on'));
        if(ws[k]) ws[k].classList.add('on');
      },onend:()=>{ ws.forEach(w=>w.classList.remove('on'));
        if(after) setTimeout(after,320); else el.classList.remove('active'); }});
  }
  host.querySelectorAll('[data-play]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); readLine(+b.dataset.play); });
  host.querySelectorAll('.w').forEach(w=>w.onclick=e=>{ e.stopPropagation(); wordPopup(w.dataset.word); });
  return {
    playAll:()=>{ const step=i=>{ if(i>=lines.length){rows.forEach(e=>e.classList.remove('active'));return;} readLine(i,()=>step(i+1)); }; step(0); },
    stop:()=>{ stopSpeak(); rows.forEach(e=>e.classList.remove('active')); host.querySelectorAll('.w.on').forEach(e=>e.classList.remove('on')); },
    read:readLine
  };
}

/* أضف كل كلمات مجموعة جمل لم تُعرَف بعد */
function addAllUnknownFrom(lines){
  let n=0;
  lines.forEach(l=>String(l[0]).split(/[^A-Za-z']+/).forEach(tok=>{
    const k=wkey(tok);
    if(k.length<2||isKnown(tok)||inReview(tok)) return;
    const h=lookup(tok); if(!h) return;
    addCard(h.t,h.ar,-1); n++;
  }));
  return n;
}

const STEPS=[0,1,2,4,8,16,32,64];
function cardKey(t){ return t.toLowerCase().trim(); }
function addCard(text,ar,ci){
  const k=cardKey(text); if(!k) return;
  if(S.cards[k]){ S.cards[k].lv=Math.max(0,S.cards[k].lv-1); S.cards[k].due=todayStr(); }
  else S.cards[k]={t:text,ar:ar||'',ci:(ci==null?-1:ci),lv:0,due:todayStr(),seen:0};
  save();
}
function gradeCard(k,good){
  const c=S.cards[k]; if(!c) return;
  c.seen=(c.seen||0)+1;
  c.lv=good?Math.min(STEPS.length-1,c.lv+1):0;
  const days=STEPS[c.lv];
  c.due=new Date(Date.now()+days*864e5).toISOString().slice(0,10);
  if(good&&c.lv>=STEPS.length-1) delete S.cards[k];
  save();
}
function dueCards(){
  const t=todayStr();

}

  const days=[]; const base=new Date();
  for(let i=0;i<7;i++){
    const d=new Date(base.getTime()+i*864e5); const ds=d.toISOString().slice(0,10);
    const n=Object.keys(S.cards).filter(k=>S.cards[k].due===ds).length;
    days.push({label:i===0?'اليوم':i===1?'غداً':d.toLocaleDateString('ar',{weekday:'short'}),n:n});
  }
  return days;
}

function speak(text,opt){

  if(opt.onword) u.onboundary=e=>{ if(e.name==='word'||e.charIndex!=null) opt.onword(e.charIndex); };
  u.onend=()=>{ if(opt.onend)opt.onend(); };
  u.onerror=()=>{ FAILED=true; showAudioHelp(); if(opt.onend)opt.onend(); };
  try{ speechSynthesis.resume(); }catch(e){}
  try{ speechSynthesis.speak(u); }catch(e){ FAILED=true; showAudioHelp(); if(opt.onend)opt.onend(); return; }
  setTimeout(()=>{ if(!started&&!SPOKE_OK){FAILED=true;showAudioHelp();} },1500);

  if(HAS_TTS){ try{speechSynthesis.cancel();}catch(e){} }
  if(ACTIVE_EXAM_TIMER){ clearInterval(ACTIVE_EXAM_TIMER); ACTIVE_EXAM_TIMER=null; }
}

/* ============ أدوات ============ */
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const norm=s=>String(s).toLowerCase().replace(/[^a-z' ]/g,'').replace(/\s+/g,' ').trim();
function plate(ch){
  return '<div class="plate" style="background:linear-gradient(180deg,'+ch.sky[0]+','+ch.sky[1]+')">'+

function paintDots(cur){

function setNav(v){

/* ============ الرئيسية — خريطة الدروس ============ */
/* صندوق مكافأة بعد كل وحدة، يفتح حقلاً من المكتبة */
const CHESTS=['home','place','sport','transport','nature','people'];

function unitList(){
  const us=[]; let cur=null;
  BOOK.forEach((c,i)=>{
    if(!cur||cur.name!==c.unit){ cur={name:c.unit,chs:[]}; us.push(cur); }
    cur.chs.push(i);
  });
  return us;
}
/* الدرس مفتوح إذا سبقه درس منجز، أو إذا كان المستخدم مشرفاً وفعّل الفتح الحر (لأغراض الاختبار فقط) */
function chapUnlocked(i){ return (S.freeMode&&isAdmin())||i===0||!!S.done[i-1]; }
function chestUnlocked(u){ return (S.freeMode&&isAdmin())||u.chs.every(i=>S.done[i]); }
function starsFor(pct){ return pct>=90?3:pct>=70?2:1; }
function nextStep(){ for(let i=0;i<BOOK.length;i++) if(!S.done[i]) return i; return -1; }
/* يجمع أسئلة الاختيار المتعدد (mcq) من كل فصول الوحدة، لبناء اختبار مراجعة تراكمي بعد إنهاء الوحدة */
function unitQuizPool(u){
  const out=[];
  u.chs.forEach(ci=>{
    const ch=BOOK[ci];
    (ch.quiz||[]).forEach((q,qi)=>{
      if(q.t!=='mcq'||!q.q) return;
      out.push({q:q.q, o:q.o.slice(), a:q.a, exp:q.hint||'', _sec:ch.t_ar, _id:'ut'+ci+'q'+qi});
    });
  });
  return out;
}
function viewUnitTest(ui){
  stopSpeak(); window.scrollTo(0,0);
  const units=unitList(); const u=units[ui];
  const pool=shuffle(unitQuizPool(u));
  if(!pool.length){ toast('لا توجد أسئلة كافية لهذه الوحدة بعد.'); return viewHome(); }
  app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="back">‹ الطريق</button></div>'+
   '<section class="sheet" style="margin-top:20px;text-align:center">'+
   '<div style="font-size:44px">🏆</div><h2 style="justify-content:center">اختبار مراجعة الوحدة</h2>'+
   '<div class="en" style="color:#8FBDB6;font-size:13px;text-align:center">'+esc(u.name)+'</div>'+
   '<div class="note" style="text-align:right;margin-top:10px">'+pool.length+' سؤالاً تجمع كل فصول هذه الوحدة، لترسيخ ما تعلّمته قبل الانتقال للوحدة التالية.</div>'+
   '<button class="btn gold wide" id="go" style="margin-top:14px">ابدأ</button></section>';
  $('#back').onclick=()=>viewHome();
  $('#go').onclick=()=>examQuiz(pool,'اختبار الوحدة',(pct)=>{
    S.unitScores=S.unitScores||{};
    const firstTime=S.unitScores[ui]==null;
    S.unitScores[ui]=Math.max(S.unitScores[ui]||0,pct);
    addXP(15); save();
    if(firstTime) viewCertificate(ui); else viewHome();
  },{silent:true,sections:true});
}

/* تدريب متداخل (interleaving) — يخلط أسئلة من كل الفصول المفتوحة بدل التركيز على فصل واحد فقط، أثبتت الأبحاث أنه يرسّخ التعلّم أكثر من التكرار المتتابع */
function allUnlockedMcqPool(){
  const out=[];
  BOOK.forEach((ch,ci)=>{
    if(!chapUnlocked(ci)) return;
    (ch.quiz||[]).forEach((q,qi)=>{
      if(q.t!=='mcq'||!q.q) return;
      out.push({q:q.q,o:q.o.slice(),a:q.a,exp:q.hint||'',_sec:ch.t_ar,_id:'il'+ci+'q'+qi});
    });
  });
  return out;
}
function viewInterleaved(){
  stopSpeak(); window.scrollTo(0,0);
  const pool=shuffle(allUnlockedMcqPool());
  if(pool.length<4){ toast('أكمل فصلاً آخر أولاً ليتوفر تدريب متداخل كافٍ.'); return viewHome(); }
  const n=Math.min(20,pool.length);
  app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="back">‹ الطريق</button></div>'+
   '<section class="sheet" style="margin-top:20px;text-align:center">'+
   '<div style="font-size:44px">🔀</div><h2 style="justify-content:center">تدريب متداخل</h2>'+
   '<div class="note" style="text-align:right;margin-top:10px">'+n+' سؤالاً من فصول مختلفة مخلوطة معاً بلا ترتيب — أسلوب يثبته علم النفس المعرفي لترسيخ التعلّم أفضل من التركيز على فصل واحد في كل مرة.</div>'+
   '<button class="btn gold wide" id="go" style="margin-top:14px">ابدأ</button></section>';
  $('#back').onclick=()=>viewHome();
  $('#go').onclick=()=>examQuiz(pool.slice(0,n),'تدريب متداخل',()=>viewHome(),{silent:true,sections:true});
}

/* احتفال بسيط بقصاصات ورق CSS — بلا أي مكتبة خارجية، يزول تلقائياً */
function confetti(){
  const colors=['#E5A22B','#2E7D6F','#8C3A56','#3E7CB1','#EAF7F2'];
  const wrap=document.createElement('div'); wrap.className='confetti-wrap';
  for(let i=0;i<28;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.left=(Math.random()*100)+'%';
    p.style.background=colors[i%colors.length];
    p.style.animationDuration=(1.6+Math.random()*1.2)+'s';
    p.style.animationDelay=(Math.random()*0.4)+'s';
    wrap.appendChild(p);
  }
  document.body.appendChild(wrap);
  setTimeout(()=>{ if(wrap.isConnected) wrap.remove(); },3200);
}
/* يتتبّع تفاعل المتعلّم مع أقسام الفصل الخمسة (لا يشترط الإكمال الكامل، بل تفاعل حقيقي مع كل قسم) */
function markChProgress(ci,key){
  S.chProgress=S.chProgress||{};
  S.chProgress[ci]=S.chProgress[ci]||{};
  if(S.chProgress[ci][key]) return;
  S.chProgress[ci][key]=true; save();
}
function chProgressOf(ci){
  const p=(S.chProgress||{})[ci]||{};
  return {story:!!p.story,gram:!!p.gram,pron:!!p.pron,vocab:!!p.vocab,quiz:!!S.done[ci]};
}
function toast(msg){
  const old=document.querySelector('.toast'); if(old) old.remove();
  const d=document.createElement('div'); d.className='toast'; d.textContent=msg;
  document.body.appendChild(d);
  setTimeout(()=>{ if(d.isConnected) d.remove(); },2200);
}

  const units=unitList();

  units.forEach((u,ui)=>{

      '<span class="ub-p">'+uDone+'/'+u.chs.length+'</span></div>';

    const rows=[];
    u.chs.forEach(i=>{
      const c=BOOK[i], done=S.done[i], open=chapUnlocked(i);
      const cls=done?'done':(open?(i===nx?'now':''):'lock');
      const icon=done?'✓':(open?c.icon:'🔒');
      rows.push({off:WAVE[step++%WAVE.length],
        html:nodeHTML(cls,icon,c.t_ar,done?starsFor(S.scores[i]||0):null,
          (i===nx&&open&&!done)?'ابدأ هنا':'', 'data-ch="'+i+'"'+(open?'':' data-locked="1"'))});
    });

    const ck=CHESTS[ui%CHESTS.length], cat=CATS.find(x=>x.k===ck);
    if(cat){
      const openC=chestUnlocked(u);
      const arr=LIB[ck]||[], rd=arr.filter((_,n)=>S.read[artId(ck,n)]).length;
      rows.push({off:WAVE[step++%WAVE.length],
        html:nodeHTML('chest'+(openC?'':' lock'),openC?'🎁':'🔒',

    }
    if(u.chs.length>=2){

      }).join('')+'</div>';
    b.querySelectorAll('[data-hwtype]').forEach(el=>el.onclick=()=>{
      const type=el.dataset.hwtype, idx=+el.dataset.hwidx;
      if(type==='chapter') viewChapter(idx); else viewReadingPassage(idx);
    });
  });
  if($('#interleave')) $('#interleave').onclick=viewInterleaved;
  app.querySelectorAll('[data-cert]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); viewCertificate(+b.dataset.cert); });

  app.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{

    viewChapter(+b.dataset.ch);

/* ============ درس احتياطي: يجمع تلقائياً الأسئلة التي أخطأتَ بها في كل ما سبق ============
   لا يحتوي محتوى ثابتاً — يُبنى من S.qMiss في كل مرة، فيختلف من مستخدم لآخر. */
function viewReserveReview(ci){
  const ch=BOOK[ci];
  S.qMiss=S.qMiss||{};
  const pool=shuffle(Object.keys(S.qMiss)
    .map(id=>{ const q=findQuestionById(id); return q?Object.assign({},q,{_id:id}):null; })
    .filter(Boolean)).slice(0,20);
  function goNext(){ if(ci<BOOK.length-1) viewChapter(ci+1,'hero'); else viewHome(); }
  if(!pool.length){
    S.done[ci]=true; save(); paintDots(ci);
    app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="back">‹ الطريق</button></div>'+
     '<section class="sheet" style="margin-top:20px;text-align:center">'+
     '<div style="font-size:44px">🎉</div><h2 style="justify-content:center">لا توجد أخطاء بعد!</h2>'+
     '<div class="note">لم تخطئ بأي سؤال حتى الآن عبر كل ما درسته — استمر بهذا الأداء الرائع.</div>'+
     '<button class="btn gold wide" id="go" style="margin-top:14px">متابعة الطريق ›</button></section>';
    $('#back').onclick=()=>viewHome();
    $('#go').onclick=goNext;
    return;
  }
  app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="back">‹ الطريق</button></div>'+
   '<section class="sheet" style="margin-top:20px;text-align:center">'+

/* ============ الاختبار ============ */
const TYPE_LABEL={mcq:'اختيار متعدد',listen:'استماع',trans:'ترجمة',order:'رتّب الجملة',match:'مطابقة',spell:'إملاء صوتي',tf:'صح أم خطأ',fill:'أكمل الفراغ'};
/* ============ توليد أسئلة تلقائي لتنويع نمط الاختبار بين درس وآخر — من بيانات الفصل نفسه، بلا حاجة لكتابة محتوى جديد يدوياً ============ */
function genTrueFalse(ch,count){
  const mcqs=(ch.quiz||[]).filter(q=>q.t==='mcq'&&q.q&&q.q.indexOf('___')>=0);
  if(!mcqs.length||count<=0) return [];
  return shuffle(mcqs.slice()).slice(0,count).map(q=>{
    const correctWord=q.o[q.a];
    const wrongOpts=q.o.filter((_,oi)=>oi!==q.a);
    const useCorrect=Math.random()<0.5||!wrongOpts.length;
    const word=useCorrect?correctWord:shuffle(wrongOpts)[0];
    return {t:'tf',stmt:q.q.replace('___',word),ans:useCorrect,correctStmt:q.q.replace('___',correctWord),hint:q.hint||''};
  });
}
function genFillBlank(ch,count){
  if(!ch.lines||!ch.lines.length||!ch.vocab||ch.vocab.length<4||count<=0) return [];
  const vocabWords=ch.vocab.map(v=>v[0]);
  const candidates=[];
  ch.lines.forEach(([en,ar])=>{
    vocabWords.forEach(w=>{
      const clean=w.replace(/[^a-zA-Z' ]/g,'');
      if(!clean) return;
      const re=new RegExp('\\b'+clean+'\\b','i');
      if(re.test(en)) candidates.push({en,ar,word:w,clean});
    });
  });
  if(!candidates.length) return [];
  return shuffle(candidates).slice(0,count).map(c=>{
    const re=new RegExp('\\b'+c.clean+'\\b','i');
    const blanked=c.en.replace(re,'_____');
    const distractors=shuffle(vocabWords.filter(w=>w.toLowerCase()!==c.word.toLowerCase())).slice(0,3);
    const opts=shuffle([c.word,...distractors]);
    return {t:'fill',blanked:blanked,ar:c.ar,o:opts,a:opts.indexOf(c.word),hint:'اختر الكلمة الصحيحة لإكمال الجملة.'};
  });
}
function viewQuiz(ci){
  stopSpeak(); window.scrollTo(0,0);
  const ch=BOOK[ci];
  /* نضع معرّفاً ثابتاً (_id) لكل سؤال أصيل قبل الخلط — يتيح لاحقاً استرجاع هذا السؤال بعينه عبر findQuestionById
     لبناء دروس المراجعة الاحتياطية من الأسئلة التي أخطأتَ بها */
  const authored=ch.quiz.map((q,qi)=>Object.assign({},q,{_id:'ch'+ci+'q'+qi}));
  /* تنويع تلقائي بين الأنماط من درس لآخر — صح/خطأ وأكمل الفراغ تُولَّد من بيانات الفصل نفسه فتضيف نمطاً مختلفاً
     كل مرة بلا تكرار رتيب لنفس البنية (٤ اختيار + استماع + ترتيب + مطابقة + إملاء) في كل درس. لا معرّف دائم لها
     (أسئلة إضافية للتنويع داخل هذا الاختبار، وتُضاف لبطاقات المراجعة عند الخطأ فيها كأي سؤال آخر). */
  const rot=ci%3;
  const extra=[...genTrueFalse(ch, rot===0?2:rot===1?1:0), ...genFillBlank(ch, rot===0?0:rot===1?2:1)];
  let queue=shuffle([...authored,...extra]), pass=1, wrong=[], right=0, total=queue.length, idx=0;

  function reg(q){
    if(q.t==='mcq'||q.t==='trans') addCard(q.o[q.a],q.hint||'',ci);
    else if(q.t==='listen'||q.t==='spell') addCard(q.say,q.hint||'',ci);
    else if(q.t==='order') addCard(q.w.join(' '),q.hint||'',ci);
    else if(q.t==='fill') addCard(q.o[q.a],q.hint||'',ci);
    else if(q.t==='tf') addCard(q.correctStmt,q.hint||'',ci);
  }
  /* كل جولة تجمع أخطاءها هي فقط — ما تصحّحه لا يعود */
  function mark(q,ok){
    if(pass===1){ if(ok){right++;addXP(5);} else reg(q); }
    if(q._id){ S.qStatus=S.qStatus||{}; S.qStatus[q._id]=ok?'correct':'wrong'; }
    if(!ok){ wrong.push(q); if(q._id){ S.qMiss=S.qMiss||{}; S.qMiss[q._id]=(S.qMiss[q._id]||0)+1; } }
  }
  function nextPass(){
    if(wrong.length&&pass<6){
      pass++; queue=shuffle(wrong.slice()); wrong=[]; idx=0;
      return banner(queue.length);
    }
    return results();
  }
  function banner(n){
    app.innerHTML='<section class="sheet" style="margin-top:30px;text-align:center"><div style="font-size:40px">🔁</div>'+
    '<h2 style="justify-content:center;margin-top:10px">جولة تصحيح '+(pass-1)+'</h2>'+
    '<p style="font-size:13px;color:var(--muted);line-height:1.9">بقي '+n+
    (n===1?' سؤال أخطأتَ فيه':' أسئلة أخطأتَ فيها')+'. ما تصحّحه لن يعود إليك.</p>'+
    '<button class="btn gold wide" id="go">تابع</button></section>';
    $('#go').onclick=render;
  }
  function shell(inner){
    app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="quit">‹ خروج</button>'+
    '<h2 style="margin:12px 0 0;font-size:18px">اختبار: '+ch.t_ar+'</h2></div>'+
    '<section class="sheet"><div class="qhead"><span class="qcount">'+(idx+1)+'/'+queue.length+'</span>'+
    '<span class="pbar"><i style="width:'+Math.round(idx/queue.length*100)+'%"></i></span></div>'+inner+'</section>';
    $('#quit').onclick=()=>{stopSpeak();viewChapter(ci,'quiz');};
  }
  function fbNext(ok,msg){
    const s=app.querySelector('.sheet');
    const d=document.createElement('div'); d.className='fb '+(ok?'ok':'no'); d.innerHTML=msg; s.appendChild(d);
    const b=document.createElement('button'); b.className='btn '+(ok?'gold':'')+' wide'; b.style.marginTop='12px';
    b.textContent='التالي ›'; b.onclick=()=>{idx++;render();}; s.appendChild(b);
    try{b.scrollIntoView({block:'nearest',behavior:'smooth'});}catch(e){}
  }
  function render(){
    if(idx>=queue.length) return nextPass();
    const q=queue[idx];
    ({mcq:rChoice,trans:rChoice,listen:rListen,order:rOrder,match:rMatch,spell:rSpell,tf:rTrueFalse,fill:rFill}[q.t])(q);
  }

  function rChoice(q){
    let conf=null;
    shell('<div class="qtype">'+TYPE_LABEL[q.t]+'</div>'+
      (q.q?'<div class="qtext en">'+esc(q.q)+'</div>':'')+
      '<div class="qhint">'+(q.t==='trans'?'اختر الترجمة الصحيحة: ':'')+(q.hint||'')+'</div>'+
      '<div class="row" style="gap:6px;margin-bottom:10px" id="confRow">'+
      '<button class="btn sm ghost" data-conf="sure" style="flex:1">😎 واثق</button>'+
      '<button class="btn sm ghost" data-conf="unsure" style="flex:1">🤔 غير متأكد</button>'+
      '<button class="btn sm ghost" data-conf="guess" style="flex:1">🎲 تخمين</button></div>'+
      '<div class="opts">'+q.o.map((o,i)=>'<button class="opt" data-i="'+i+'"><span class="en">'+esc(o)+'</span></button>').join('')+'</div>');
    app.querySelectorAll('[data-conf]').forEach(b=>b.onclick=()=>{
      conf=b.dataset.conf;
      app.querySelectorAll('[data-conf]').forEach(x=>x.classList.toggle('gold',x===b));
    });
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=+b.dataset.i===q.a;
      app.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(+x.dataset.i===q.a)x.classList.add('ok');});
      if(!ok) b.classList.add('no');
      speak(q.o[q.a]); mark(q,ok);
      let msg;
      if(conf==='sure'&&ok) msg='✅ أحسنت — وثقت بنفسك وكنت محقاً!';
      else if(conf==='sure'&&!ok) msg='❌ كنت واثقاً لكن الإجابة خطأ — الصحيح: <span class="en">'+esc(q.o[q.a])+'</span>. راجع هذه النقطة جيداً، فهم خاطئ راسخ يحتاج تصحيحاً مبكراً.';
      else if(conf==='guess'&&ok) msg='✅ صحيح، لكنك خمّنت — ستعود هذه للمراجعة لترسيخها فعلاً.';
      else msg=ok?'أحسنت ✓':'الجواب الصحيح: <span class="en">'+esc(q.o[q.a])+'</span>';
      fbNext(ok, msg);
    });
  }
  function rTrueFalse(q){
    shell('<div class="qtype">'+TYPE_LABEL.tf+'</div>'+
      '<div class="qtext en" style="text-align:center">'+esc(q.stmt)+'</div>'+
      '<div class="qhint" style="text-align:center">'+(q.hint||'هل هذه الجملة صحيحة أم لا؟')+'</div>'+
      '<div class="opts" style="margin-top:12px">'+
      '<button class="opt" data-v="1"><span class="en">✅ صحيحة — True</span></button>'+
      '<button class="opt" data-v="0"><span class="en">❌ خاطئة — False</span></button>'+
      '</div>');
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const picked=b.dataset.v==='1';
      const ok=picked===q.ans;
      app.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if((x.dataset.v==='1')===q.ans)x.classList.add('ok');});
      if(!ok) b.classList.add('no');
      speak(q.correctStmt); mark(q,ok);
      fbNext(ok, ok?'صحيح ✓':'الجملة الصحيحة: <span class="en">'+esc(q.correctStmt)+'</span>');
    });
  }
  function rFill(q){
    shell('<div class="qtype">'+TYPE_LABEL.fill+'</div>'+
      '<div class="qtext en" style="text-align:left;direction:ltr">'+esc(q.blanked)+'</div>'+
      (q.ar?'<div class="qhint">'+esc(q.ar)+'</div>':'')+
      '<div class="opts" style="margin-top:10px">'+q.o.map((o,i)=>'<button class="opt" data-i="'+i+'"><span class="en">'+esc(o)+'</span></button>').join('')+'</div>');
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=+b.dataset.i===q.a;
      app.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(+x.dataset.i===q.a)x.classList.add('ok');});
      if(!ok) b.classList.add('no');
      speak(q.o[q.a]); mark(q,ok);
      fbNext(ok, ok?'أحسنت ✓':'الكلمة الصحيحة: <span class="en">'+esc(q.o[q.a])+'</span>');
    });
  }
  function rListen(q){
    shell('<div class="qtype">'+TYPE_LABEL.listen+'</div>'+
      '<div class="qtext">استمع جيداً ثم اختر الكلمة التي سمعتها.</div>'+
      '<div class="qhint">يمكنك الإعادة أكثر من مرة.</div>'+
      '<button class="btn gold wide" id="rep" style="margin-bottom:14px">🔊 استمع</button>'+
      '<div class="opts">'+q.o.map((o,i)=>'<button class="opt" data-i="'+i+'"><span class="en">'+esc(o)+'</span></button>').join('')+'</div>');
    const play=()=>speak(q.say,{rate:0.72});
    $('#rep').onclick=play; setTimeout(play,400);
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=+b.dataset.i===q.a;
      app.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(+x.dataset.i===q.a)x.classList.add('ok');});
      if(!ok) b.classList.add('no');
      mark(q,ok);
      fbNext(ok, ok?'سمعتَها صحيحة ✓':'الكلمة كانت: <span class="en">'+esc(q.say)+'</span>');
    });
  }
  function rSpell(q){
    shell('<div class="qtype">'+TYPE_LABEL.spell+'</div>'+
      '<div class="qtext">استمع واكتب الكلمة كما تُكتب.</div>'+
      '<div class="qhint">'+(q.hint||'')+'</div>'+
      '<button class="btn gold wide" id="rep" style="margin-bottom:14px">🔊 استمع</button>'+
      '<input class="tin" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="اكتب هنا">'+
      '<button class="btn wide" id="chk" style="margin-top:12px">تحقّق</button>');
    const play=()=>speak(q.say,{rate:0.7});
    $('#rep').onclick=play; setTimeout(play,450);
    const go=()=>{
      const ok=norm($('#ans').value)===norm(q.say);
      $('#ans').disabled=true; $('#chk').disabled=true;
      mark(q,ok);
      fbNext(ok, ok?'إملاء صحيح ✓':'الكتابة الصحيحة: <span class="en">'+esc(q.say)+'</span>');
    };
    $('#chk').onclick=go;
    $('#ans').onkeydown=e=>{ if(e.key==='Enter') go(); };
  }
  function rOrder(q){
    const pool=shuffle(q.w.slice()); let chosen=[];
    shell('<div class="qtype">'+TYPE_LABEL.order+'</div>'+
      '<div class="qtext">رتّب الكلمات لتكوين الجملة.</div><div class="qhint">'+(q.hint||'')+'</div>'+
      '<div class="slot" id="slot"></div><div class="pool" id="pool"></div>'+
      '<button class="btn gold wide" id="chk" style="margin-top:14px" disabled>تحقّق</button>');
    function draw(){
      $('#slot').innerHTML=chosen.map((w,i)=>'<button class="tok in" data-r="'+i+'">'+esc(w)+'</button>').join('');
      $('#pool').innerHTML=pool.map((w,i)=>w===null?'':'<button class="tok" data-a="'+i+'">'+esc(w)+'</button>').join('');
      $('#chk').disabled=chosen.length!==q.w.length;
      $('#slot').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
        const i=+b.dataset.r, si=pool.indexOf(null);
        if(si>-1) pool[si]=chosen[i]; else pool.push(chosen[i]);
        chosen.splice(i,1); draw();
      });
      $('#pool').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
        const i=+b.dataset.a; chosen.push(pool[i]); pool[i]=null; draw();
      });
    }
    draw();
    $('#chk').onclick=()=>{
      const correct=q.w.join(' '), ok=chosen.join(' ')===correct;
      speak(correct); mark(q,ok);
      $('#chk').disabled=true; app.querySelectorAll('.tok').forEach(t=>t.disabled=true);
      fbNext(ok, ok?'ترتيب صحيح ✓':'الترتيب الصحيح: <span class="en">'+esc(correct)+'</span>');
    };
  }
  function rMatch(q){
    const L=shuffle(q.p.map(p=>p[0])), R=shuffle(q.p.map(p=>p[1])), map={};
    q.p.forEach(p=>map[p[0]]=p[1]);
    let sel=null, matched=0, mist=0;
    shell('<div class="qtype">'+TYPE_LABEL.match+'</div>'+
      '<div class="qtext">اضغط الكلمة الإنكليزية ثم معناها.</div><div class="qhint">أربعة أزواج.</div>'+
      '<div class="mgrid"><div>'+L.map(w=>'<button class="mcell en" data-l="'+esc(w)+'">'+esc(w)+'</button>').join('')+
      '</div><div>'+R.map(w=>'<button class="mcell" data-r="'+esc(w)+'">'+esc(w)+'</button>').join('')+'</div></div>');
    app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{
      app.querySelectorAll('[data-l]').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); sel=b; speak(b.dataset.l,{rate:0.8});
    });
    app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
      if(!sel) return;
      if(map[sel.dataset.l]===b.dataset.r){
        sel.classList.add('done'); b.classList.add('done');
        sel.disabled=true; b.disabled=true; sel=null; matched++;
        if(matched===q.p.length){ const ok=mist===0; mark(q,ok);
          fbNext(ok, ok?'مطابقة كاملة بلا خطأ ✓':'أكملتَها مع '+mist+' خطأ — ستعود في المراجعة.'); }
      }else{
        mist++; addCard(sel.dataset.l,map[sel.dataset.l],ci);
        b.classList.add('bad'); const s=sel;
        setTimeout(()=>{b.classList.remove('bad');s.classList.remove('sel');},500); sel=null;
      }
    });
  }
  function results(){
    const pct=Math.round(right/total*100);
    S.done[ci]=true; S.scores[ci]=pct; addXP(20); save(); paintDots(ci);
    if(pct>=80){ try{confetti();}catch(e){} }
    app.innerHTML='<section class="sheet" style="margin-top:30px"><div class="score">'+
     '<div class="big" style="color:'+(pct>=70?'var(--leaf)':'var(--plum)')+'">'+pct+'٪</div>'+
     '<div class="lab">'+right+' إجابة صحيحة من '+total+'</div></div>'+
     '<div class="note" style="margin-top:14px">'+(pct>=80?'🏆 أداء خرافي — أتقنت هذا الفصل تماماً!':pct>=70?'ممتاز — أنت جاهز للفصل التالي.':'راجع القصة والقاعدة ثم أعد الاختبار.')+
     ''+'</div>'+
     '<div style="display:grid;gap:9px;margin-top:14px">'+
     '<button class="btn gold wide" id="again">أعد الاختبار</button>'+
     '<button class="btn wide" id="toch">عد إلى الفصل</button>'+
     (ci<BOOK.length-1?'<button class="btn wide" id="nx">الفصل التالي ›</button>':'')+'</div></section>';
    $('#again').onclick=()=>viewQuiz(ci);
    $('#toch').onclick=()=>viewChapter(ci,'quiz');
    if($('#nx')) $('#nx').onclick=()=>viewChapter(ci+1);
  }
  render();
}

/* ============ الميكروفون ============ */
function viewMic(ci){
  stopSpeak(); window.scrollTo(0,0);
  const ch=BOOK[ci];
  const words=shuffle([].concat.apply([],ch.pron.groups.map(g=>g[1]))).slice(0,8);
  let i=0, ok=0;
  function draw(msg,cls){
    if(i>=words.length) return done();
    const w=words[i];
    app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="back">‹ الفصل</button></div>'+
    '<section class="sheet"><div class="qhead"><span class="qcount">'+(i+1)+'/'+words.length+'</span>'+
    '<span class="pbar"><i style="width:'+Math.round(i/words.length*100)+'%"></i></span></div>'+
    '<div class="qhint" style="text-align:center">استمع، ثم اضغط الميكروفون وانطق</div>'+
    '<div class="bigword">'+esc(w)+'</div>'+
    '<div style="text-align:center"><button class="btn sm" id="hear">🔊 استمع</button></div>'+
    '<button class="mic" id="mic">🎤</button>'+
    (msg?'<div class="fb '+cls+'">'+msg+'</div>':'')+
    '<button class="btn ghost wide" id="skip" style="margin-top:10px">تخطّي ›</button></section>';
    $('#back').onclick=()=>viewChapter(ci,'pron');
    $('#hear').onclick=()=>speak(w,{rate:0.68});
    $('#skip').onclick=()=>{i++;draw();};
    $('#mic').onclick=listen;
    setTimeout(()=>speak(w,{rate:0.68}),350);
  }
  function listen(){
    if(!SR){ i=i; return draw('الميكروفون غير مدعوم هنا. افتح الملف في Chrome على الهاتف لتفعيل التصحيح الصوتي.','no'); }
    stopSpeak();
    const r=new SR(); r.lang='en-US'; r.interimResults=false; r.maxAlternatives=5;
    const btn=$('#mic'); btn.classList.add('live'); btn.textContent='●';
    r.onresult=e=>{
      const alts=[...e.results[0]].map(a=>norm(a.transcript));
      const target=norm(words[i]);
      const good=alts.some(a=>a===target||a.split(' ').indexOf(target)>-1);
      if(good){ ok++; addXP(3); i++; draw('نطق صحيح ✓','ok'); }
      else{ addCard(words[i],'',ci); const heard=alts[0]||'—'; i++;
        draw('سمعتُ: <span class="en">'+esc(heard)+'</span> — أعد الاستماع وركّز. أضفتُها للمراجعة.','no'); }
    };
    r.onerror=()=>{ btn.classList.remove('live'); btn.textContent='🎤'; draw('لم ألتقط صوتاً. اسمح باستخدام الميكروفون.','no'); };
    r.onend=()=>{ if(btn.isConnected){btn.classList.remove('live');btn.textContent='🎤';} };
    try{ r.start(); }catch(e){ draw('تعذّر تشغيل الميكروفون.','no'); }
  }
  function done(){
    const pct=Math.round(ok/words.length*100);
    app.innerHTML='<section class="sheet" style="margin-top:30px"><div class="score">'+
      '<div class="big" style="color:'+(pct>=70?'var(--leaf)':'var(--plum)')+'">'+pct+'٪</div>'+
      '<div class="lab">'+ok+' نطق صحيح من '+words.length+'</div></div>'+
      '<div style="display:grid;gap:9px;margin-top:14px">'+
      '<button class="btn gold wide" id="again">أعد التدريب</button>'+
      '<button class="btn wide" id="b2">عد إلى الفصل</button></div></section>';
    $('#again').onclick=()=>viewMic(ci);
    $('#b2').onclick=()=>viewChapter(ci,'pron');
  }
  draw();
}

function runReview(keys){
  let i=0, good=0;
  function draw(show){
    if(i>=keys.length) return done();
    const c=S.cards[keys[i]];
    app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="back">‹ خروج</button></div>'+
    '<section class="sheet"><div class="qhead"><span class="qcount">'+(i+1)+'/'+keys.length+'</span>'+
    '<span class="pbar"><i style="width:'+Math.round(i/keys.length*100)+'%"></i></span></div>'+
    '<div class="qhint" style="text-align:center">هل تتذكّر معناها؟</div>'+
    '<div class="bigword" style="font-size:'+(c.t.length>18?'22px':'32px')+'">'+esc(c.t)+'</div>'+
    '<div style="text-align:center;margin-bottom:12px"><button class="btn sm" id="hear">🔊 استمع</button></div>'+
    (show?'<div class="note" style="text-align:center;font-size:15px">'+(c.ar||'—')+'</div>'+
      '<div class="row" style="margin-top:14px"><button class="btn wide" id="no" style="flex:1;background:var(--plum);color:#fff">نسيتها</button>'+
      '<button class="btn gold wide" id="yes" style="flex:1">أتذكّرها ✓</button></div>'
     :'<button class="btn gold wide" id="show">أظهر المعنى</button>')+
    '</section>';
    $('#back').onclick=()=>{stopSpeak();viewReview();};
    $('#hear').onclick=()=>speak(c.t,{rate:0.72});
    if(show){
      $('#yes').onclick=()=>{gradeCard(keys[i],true);good++;addXP(4);i++;draw(false);};
      $('#no').onclick=()=>{gradeCard(keys[i],false);i++;draw(false);};
    }else $('#show').onclick=()=>draw(true);
    setTimeout(()=>speak(c.t,{rate:0.72}),300);
  }
  function done(){
    const pct=Math.round(good/keys.length*100);
    app.innerHTML='<section class="sheet" style="margin-top:30px"><div class="score">'+
      '<div class="big">'+pct+'٪</div><div class="lab">تذكّرت '+good+' من '+keys.length+'</div></div>'+
      '<div class="note" style="margin-top:14px">أُعيد جدولة البطاقات. ما نسيته سيعود غداً، وما تذكّرته تباعد موعده.</div>'+
      '<button class="btn gold wide" id="b" style="margin-top:14px">تم</button></section>';
    $('#b').onclick=viewReview;
  }
  draw(false);
}

/* ============ لوحة الإدارة (تظهر فقط لبريد مدرج في ADMIN_EMAILS) ============ */
function viewAdmin(){
  stopSpeak(); paintDots(-1); setNav('more'); window.scrollTo(0,0);
  if(!isAdmin()){ app.innerHTML='<div style="padding-top:40px" class="note">🚫 هذه الصفحة للمشرف فقط.</div>'; return; }
  if(!fbDB){ app.innerHTML='<div style="padding-top:40px" class="note">⚠ لا يمكن الوصول لقاعدة البيانات السحابية حالياً (تعذّر الاتصال). حاول لاحقاً.</div>'; return; }
  app.innerHTML='<div style="padding-top:20px"><button class="btn sm" id="back">‹ رجوع</button>'+
   '<h2 style="margin:10px 0 4px;font-size:22px">🛠 لوحة الإدارة</h2>'+
   '<p style="color:#9FC7C1;font-size:13px">كل المستخدمين المسجّلين عبر Firebase.</p></div>'+
   '<section class="sheet" id="hwAdmin" style="margin-bottom:14px"><div class="note">جارٍ تحميل الواجبات…</div></section>'+
   '<section class="sheet" id="adminBody"><div class="note">جارٍ التحميل…</div></section>';
  $('#back').onclick=viewAccount;

  /* إدارة الواجبات: نشر واجب جديد (درس أو مقالة) بموعد وملاحظة اختياريين، وعرض/حذف الواجبات الحالية */
  function drawHwAdmin(){
    const chOpts=BOOK.map((c,i)=>'<option value="'+i+'">'+esc(c.t_ar)+'</option>').join('');
    const rdOpts=READING_LIB.map((r,i)=>'<option value="'+i+'">'+esc(r.t_ar)+'</option>').join('');
    $('#hwAdmin').innerHTML='<h2 style="font-size:15px"><i>📌</i> إدارة الواجبات</h2>'+
      '<div class="row" style="gap:8px;flex-wrap:wrap;margin-top:8px">'+
      '<select id="hwType" class="fin" style="width:auto"><option value="chapter">درس</option><option value="reading">مقالة</option></select>'+
      '<select id="hwItem" class="fin" style="flex:1;min-width:160px">'+chOpts+'</select>'+
      '</div>'+
      '<div class="row" style="gap:8px;flex-wrap:wrap;margin-top:8px">'+
      '<input id="hwDue" type="date" class="fin" style="width:auto">'+
      '<input id="hwNote" type="text" placeholder="ملاحظة (اختياري)" class="fin" style="flex:1;min-width:160px">'+
      '</div>'+
      '<button class="btn sm gold" id="hwPost" style="margin-top:8px">➕ نشر واجب جديد</button>'+
      '<div id="hwList" style="margin-top:12px"><div class="note">جارٍ التحميل…</div></div>';
    $('#hwType').onchange=()=>{ $('#hwItem').innerHTML = $('#hwType').value==='chapter'?chOpts:rdOpts; };
    $('#hwPost').onclick=()=>{
      const type=$('#hwType').value, idx=+$('#hwItem').value;
      const dueV=$('#hwDue').value, note=$('#hwNote').value.trim();
      const item={type:type, note:note};
      if(type==='chapter') item.ci=idx; else item.ri=idx;
      if(dueV) item.due=new Date(dueV+'T23:59:59').getTime();
      postHomework(item,(ok,e)=>{
        if(ok){ toast('✅ تم نشر الواجب.'); $('#hwNote').value=''; refreshHwList(); }
        else toast('⚠ تعذّر النشر: '+fbErrMsg(e));
      });
    };
    refreshHwList();
    function refreshHwList(){
      fbDB.collection('homework').orderBy('postedAt','desc').limit(30).get().then(snap=>{
        const list=[]; snap.forEach(d=>list.push(Object.assign({id:d.id},d.data())));
        $('#hwList').innerHTML=list.length?list.map(hw=>{
          const isCh=hw.type==='chapter';
          const item=isCh?BOOK[hw.ci]:READING_LIB[hw.ri];
          const label=item?item.t_ar:'(محذوف)';
          const dueTxt=hw.due?new Date(hw.due).toLocaleDateString('ar-IQ'):'بدون موعد';
          return '<div class="ul-item" style="display:flex;justify-content:space-between;align-items:center;gap:8px">'+
            '<div><div style="font-weight:700">'+(isCh?'📘 ':'📰 ')+esc(label)+'</div>'+
            (hw.note?'<div style="font-size:12px;color:var(--muted)">'+esc(hw.note)+'</div>':'')+

            '<button class="btn ghost sm" data-hwdel="'+hw.id+'">🗑</button></div>';
        }).join(''):'<div class="note">لا توجد واجبات منشورة بعد.</div>';
        $('#hwList').querySelectorAll('[data-hwdel]').forEach(b2=>b2.onclick=()=>{
          deleteHomework(b2.dataset.hwdel,(ok)=>{ if(ok){ toast('🗑 تم الحذف.'); refreshHwList(); } else toast('⚠ تعذّر الحذف.'); });
        });
      }).catch(e=>{ $('#hwList').innerHTML='<div class="note" style="color:var(--plum)">تعذّر تحميل الواجبات: '+esc(fbErrMsg(e))+'</div>'; });
    }
  }
  drawHwAdmin();

  function fmtDT(ts){ if(!ts) return '—'; const d=new Date(ts); return d.toLocaleDateString('ar-IQ')+' '+d.toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'}); }
  function userSummary(u){
    const qStatus=u.qStatus||{}; const vals=Object.values(qStatus);
    const correct=vals.filter(v=>v==='correct').length;
    const total=vals.length;
    const acc=total?Math.round(correct/total*100):null;
    const mh=(u.exam&&u.exam.mockHistory)||[];
    const bestMock=mh.length?Math.max.apply(null,mh.map(h=>h.pct||0)):null;
    return {acc:acc,total:total,bestMock:bestMock,streak:u.streak||0,cardsN:Object.keys(u.cards||{}).length};
  }
  /* نظرة عامة على الصف كاملاً: متوسط الدقة، متوسط أفضل تجريبي، عدد الطلاب النشطين هذا الأسبوع،
     وأكثر الأقسام التي يخطئ بها الطلاب مجتمعين — لتحديد أين يحتاج الصف تركيزاً إضافياً */
  function classOverview(users){
    const withAcc=users.map(u=>userSummary(u)).filter(s=>s.acc!=null);
    const avgAcc=withAcc.length?Math.round(withAcc.reduce((a,s)=>a+s.acc,0)/withAcc.length):null;
    const withMock=users.map(u=>userSummary(u)).filter(s=>s.bestMock!=null);
    const avgMock=withMock.length?Math.round(withMock.reduce((a,s)=>a+s.bestMock,0)/withMock.length):null;
    const weekAgo=Date.now()-7*864e5;
    const activeThisWeek=users.filter(u=>u.lastSeen&&u.lastSeen>=weekAgo).length;
    /* تجميع أخطاء الأقسام عبر كل الطلاب من qStatus الخاص بكل واحد */
    const secMiss={}, secTotal={};
    users.forEach(u=>{
      const qs=u.qStatus||{};
      Object.entries(qs).forEach(([id,st])=>{
        const sec=id.replace(/\d.*$/,''); /* بادئة نوع السؤال كتقريب للقسم: ch/g/f/dl/i/d/p */
        secTotal[sec]=(secTotal[sec]||0)+1;
        if(st==='wrong') secMiss[sec]=(secMiss[sec]||0)+1;
      });
    });
    const secLabel={ch:'فصول القصة',g:'القواعد',f:'الوظائف اللغوية',dl:'المحادثات',i:'التعابير الاصطلاحية',d:'أساليب مباشرة',p:'الفهم المقروء'};
    const secRates=Object.keys(secTotal).filter(k=>secTotal[k]>=5).map(k=>({k,rate:Math.round((secMiss[k]||0)/secTotal[k]*100)})).sort((a,b)=>b.rate-a.rate).slice(0,3);
    return '<section class="sheet" style="margin-bottom:14px"><h2 style="font-size:15px"><i>📊</i> نظرة عامة على الصف</h2>'+
      '<div class="stats" style="margin-top:8px">'+
      '<div class="stat"><div class="n">'+users.length+'</div><div class="l">طالب مسجّل</div></div>'+
      '<div class="stat"><div class="n">'+activeThisWeek+'</div><div class="l">نشط هذا الأسبوع</div></div>'+
      '<div class="stat"><div class="n">'+(avgAcc!=null?avgAcc+'٪':'—')+'</div><div class="l">متوسط الدقة</div></div>'+

/* يبني ملف CSV (يفتح مباشرة في Excel) من صفوف بيانات وينزّله — لا يحتاج أي مكتبة خارجية أو اتصال إنترنت */
function downloadCSV(filename, header, rows){
  function cell(v){ v=(v==null?'':String(v)); if(/[",\n]/.test(v)) v='"'+v.replace(/"/g,'""')+'"'; return v; }
  const lines=[header.map(cell).join(',')].concat(rows.map(r=>r.map(cell).join(',')));
  const csv='﻿'+lines.join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}

/* فحص تناسق بيانات الأسئلة عبر كل البنوك — نسخة داخل التطبيق من فحوصات Node المستخدمة أثناء التطوير */
function dataConsistencyReport(){
  const issues=[]; let totalQ=0;
  function checkArr(catLabel,arr,idOf){
    (arr||[]).forEach((q,i)=>{
      totalQ++;
      const id=idOf?idOf(q,i):(catLabel+'#'+i);
      if(!q.q||!String(q.q).trim()) issues.push(catLabel+' — سؤال فارغ عند الفهرس '+i);
      if(!Array.isArray(q.o)||q.o.length<2) issues.push(catLabel+' — خيارات ناقصة ('+id+')');
      else if(typeof q.a!=='number'||q.a<0||q.a>=q.o.length) issues.push(catLabel+' — فهرس إجابة غير صالح ('+id+')');
    });
  }
  checkArr('القواعد',EXAM.grammar);
  checkArr('أسئلة مباشرة',EXAM.direct);
  checkArr('الوظائف اللغوية',EXAM.functions);
  checkArr('المحادثات الكتابية',EXAM.dialogues);
  checkArr('تعابير اصطلاحية',EXAM.idioms);
  (EXAM.passages||[]).forEach((p,pi)=>{
    if(!p.text||!String(p.text).trim()) issues.push('قطعة '+pi+' — نص فارغ');
    checkArr('قطعة '+pi,p.q);
  });
  /* تكرار المعرّفات (_id) عبر كل البنوك مجتمعة */
  const ids={}; let dupCount=0;
  ['grammar','direct','functions','dialogues','idioms'].forEach(k=>(EXAM[k]||[]).forEach(q=>{
    if(q._id){ if(ids[q._id]) dupCount++; ids[q._id]=(ids[q._id]||0)+1; }
  }));
  (EXAM.passages||[]).forEach(p=>(p.q||[]).forEach(q=>{
    if(q._id){ if(ids[q._id]) dupCount++; ids[q._id]=(ids[q._id]||0)+1; }
  }));
  if(dupCount) issues.push('معرّفات (_id) مكرّرة: '+dupCount+' حالة');
  const ok=!issues.length;
  return '<div class="note" style="margin-top:10px;'+(ok?'':'color:var(--plum)')+'">'+
    (ok?('✅ لا توجد مشاكل — تم فحص '+totalQ+' سؤالاً بنجاح.'):
      ('⚠️ وُجدت '+issues.length+' مشكلة من أصل '+totalQ+' سؤالاً:<br>'+issues.slice(0,50).map(esc).join('<br>')+
       (issues.length>50?'<br>…و'+(issues.length-50)+' مشكلة أخرى':'')))+
    '</div>';
}

function artQuiz(ck,ai,a){
  stopSpeak(); window.scrollTo(0,0);
  let i=0, right=0;
  function draw(){
    if(i>=a.Q.length) return done();
    const q=a.Q[i];
    if(!q._o){ const idx=shuffle(q.o.map((_,n)=>n)); q._o=idx.map(n=>q.o[n]); q._a=idx.indexOf(q.a); }
    app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="quit">‹ خروج</button></div>'+
    '<section class="sheet"><div class="qhead"><span class="qcount">'+(i+1)+'/'+a.Q.length+'</span>'+
    '<span class="pbar"><i style="width:'+Math.round(i/a.Q.length*100)+'%"></i></span></div>'+
    '<div class="qtype">فهم المقروء</div>'+
    '<div class="qtext en">'+esc(q.q)+'</div><div class="qhint">أكمل الفراغ حسب ما قرأت.</div>'+
    '<div class="opts">'+q._o.map((o,n)=>'<button class="opt" data-n="'+n+'"><span class="en">'+esc(o)+'</span></button>').join('')+'</div></section>';
    $('#quit').onclick=()=>viewArt(ck,ai);
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=+b.dataset.n===q._a;
      app.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(+x.dataset.n===q._a)x.classList.add('ok');});
      if(!ok) b.classList.add('no');
      if(ok){right++;addXP(4);} else addCard(q.o[q.a],'',-1);
      speak(q.q.replace('___',q.o[q.a]));
      const s=app.querySelector('.sheet');
      const d=document.createElement('div'); d.className='fb '+(ok?'ok':'no');
      d.innerHTML=ok?'صحيح ✓':'الجواب: <span class="en">'+esc(q.o[q.a])+'</span>'; s.appendChild(d);
      const nb=document.createElement('button'); nb.className='btn '+(ok?'gold':'')+' wide';
      nb.style.marginTop='12px'; nb.textContent='التالي ›'; nb.onclick=()=>{i++;draw();}; s.appendChild(nb);
    });
  }
  function done(){
    const pct=Math.round(right/a.Q.length*100);
    S.read=S.read||{}; S.read[artId(ck,ai)]={score:pct,d:todayStr()}; addXP(10); save();
    const arr=LIB[ck], nxt=ai<arr.length-1?ai+1:-1;
    app.innerHTML='<section class="sheet" style="margin-top:30px"><div class="score">'+
      '<div class="big" style="color:'+(pct>=67?'var(--leaf)':'var(--plum)')+'">'+pct+'٪</div>'+
      '<div class="lab">'+right+' من '+a.Q.length+'</div></div>'+
      '<div style="display:grid;gap:9px;margin-top:14px">'+
      (nxt>=0?'<button class="btn gold wide" id="nx">المقال التالي ›</button>':'')+
      '<button class="btn wide" id="re">أعد قراءة المقال</button>'+
      '<button class="btn wide" id="cat">عد إلى الحقل</button></div></section>';
    if($('#nx')) $('#nx').onclick=()=>viewArt(ck,nxt);
    $('#re').onclick=()=>viewArt(ck,ai);
    $('#cat').onclick=()=>viewCat(ck);
  }
  draw();
}

function fbErrMsg(e){
  const c=(e&&e.code)||'';
  const map={
    'auth/email-already-in-use':'هذا البريد مسجّل مسبقاً — جرّب الدخول بدل إنشاء حساب.',
    'auth/invalid-email':'صيغة البريد الإلكتروني غير صحيحة.',
    'auth/weak-password':'كلمة السر ضعيفة — استعمل ٦ أحرف على الأقل.',
    'auth/wrong-password':'كلمة السر غير صحيحة.',
    'auth/user-not-found':'لا يوجد حساب بهذا البريد.',
    'auth/popup-closed-by-user':'أُغلقت نافذة الدخول قبل إكمالها.',
    'auth/network-request-failed':'تعذّر الاتصال بالإنترنت.'
  };
  return map[c]||(e&&e.message)||'حدث خطأ غير متوقع.';
}
function isAdmin(){ return !!(FB_USER && FB_USER.email && ADMIN_EMAILS.map(x=>x.toLowerCase()).includes(FB_USER.email.toLowerCase())); }
/* الواجبات: مجموعة Firestore منفصلة 'homework' يديرها المشرف فقط (نشر/حذف)، ويقرأها أي مستخدم مسجّل دخول لعرضها في الصفحة الرئيسية */
let HW_CACHE=null;
function loadHomework(cb){
  if(!fbDB){ cb([]); return; }
  fbDB.collection('homework').orderBy('postedAt','desc').limit(20).get().then(snap=>{
    const list=[]; snap.forEach(d=>list.push(Object.assign({id:d.id},d.data())));
    const now=Date.now();
    const active=list.filter(h=>!h.due || h.due>=now-864e5); /* نُبقي الواجب ظاهراً حتى يوم بعد موعده كسماحية */
    HW_CACHE=active; cb(active);
  }).catch(()=>cb([]));
}
function postHomework(item,cb){
  if(!fbDB||!isAdmin()) return;
  fbDB.collection('homework').add(Object.assign({postedAt:Date.now(),postedBy:(FB_USER&&FB_USER.email)||''},item))
    .then(()=>{ HW_CACHE=null; cb&&cb(true); }).catch(e=>{ cb&&cb(false,e); });
}
function deleteHomework(id,cb){
  if(!fbDB||!isAdmin()) return;
  fbDB.collection('homework').doc(id).delete()
    .then(()=>{ HW_CACHE=null; cb&&cb(true); }).catch(e=>{ cb&&cb(false,e); });
}
async function onFbAuthChange(user){
  FB_USER=user||null;
  if(!user) return;
  try{
    const ref=fbDB.collection('users').doc(user.uid);
    const snap=await ref.get();
    const remote=snap.exists?snap.data():null;
    if(remote && (remote.updated||0)>(S.updated||0)){
      S=Object.assign({},BLANK,remote); writeLocal();
    }
    S.user={name:user.displayName||(S.user&&S.user.name)||(user.email||'').split('@')[0],email:user.email||'',uid:user.uid};
    await ref.set({name:S.user.name,email:S.user.email,uid:user.uid,lastSeen:Date.now()},{merge:true});
    save();
  }catch(e){ /* لا اتصال أو صلاحيات — يستمر العمل محلياً بصمت */ }
  paintHead();
}
/* يسجّل محاولة اختبار/تمرين واحدة في Firestore (users/{uid}/attempts) لعرضها لاحقاً في لوحة الإدارة.
   لا يفعل شيئاً إن لم يكن هناك مستخدم مسجّل دخول أو Firebase غير مفعّل — التطبيق يستمر بالعمل محلياً بصمت. */

}

/* ============ التدريب الذكي — يتكيّف تلقائياً مع مستوى الطالب على الخريطة ============ */
/* إلى أي درس وصل الطالب فعلياً (آخر درس منجز + الدرس الحالي الذي لم يُنهِه بعد) */
function reachedChapterIdx(){
  const nx=nextStep();
  return nx===-1 ? BOOK.length-1 : nx;
}
/* يبني حزمة أسئلة متكيّفة: أولوية لأخطائه المتكررة (S.qMiss)، ثم مادة الدروس التي وصل إليها ولم يُختبر
   بها بعد، وأخيراً قليل من مادة قديمة أجاب عنها صحيحاً — مراجعة متباعدة غير مباشرة لترسيخها بالذاكرة.
   لا يضع أبداً سؤالاً من درس لم يصل إليه الطالب بعد على الخريطة. */
function smartPool(n){
  n=n||16;
  const upTo=reachedChapterIdx();
  S.qStatus=S.qStatus||{}; S.qMiss=S.qMiss||{};
  const chQs=[];
  BOOK.forEach((c,ci)=>{
    if(ci>upTo||c.reserveReview) return;
    (c.quiz||[]).forEach((q,qi)=>chQs.push(Object.assign({},q,{_id:'ch'+ci+'q'+qi})));
  });
  const missQs=Object.keys(S.qMiss).sort((a,b)=>S.qMiss[b]-S.qMiss[a]).map(findQuestionById).filter(Boolean);
  const unseen=chQs.filter(q=>!S.qStatus[q._id]);
  const seenOk=chQs.filter(q=>S.qStatus[q._id]==='correct');
  const nMiss=Math.min(missQs.length,Math.ceil(n*0.4));
  const nUnseen=Math.min(unseen.length,Math.ceil(n*0.4));
  const nReview=Math.max(0,n-nMiss-nUnseen);
  let pool=[...shuffle(missQs).slice(0,nMiss),...shuffle(unseen).slice(0,nUnseen),...shuffle(seenOk).slice(0,nReview)];
  if(pool.length<Math.min(n,5)) pool=chQs.slice(); /* بداية الطريق: مادة غير كافية بعد، استخدم كل ما وصل إليه */
  return shuffle(pool).slice(0,n);
}
function viewSmartPractice(){
  stopSpeak(); paintDots(-1); setNav('practice'); window.scrollTo(0,0);
  const upTo=reachedChapterIdx();
  const pool=smartPool(16);
  const missN=Object.keys(S.qMiss||{}).length;
  if(!pool.length){
    app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="back">‹ تدرّب</button></div>'+
     '<section class="sheet" style="text-align:center;margin-top:14px"><div style="font-size:40px">🎯</div>'+

    $('#back').onclick=viewPractice;
    return;
  }
  app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="back">‹ تدرّب</button></div>'+
   '<section class="sheet"><h2><i>🎯</i> التدريب الذكي</h2>'+

   (missN?'<div class="row" style="margin-top:10px"><span class="diag">🔁 أخطاء تُراجَع الآن: '+missN+'</span></div>':'')+
   '<button class="btn gold wide" id="go" style="margin-top:16px">ابدأ ('+pool.length+' سؤال)</button></section>';
