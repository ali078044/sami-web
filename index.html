function synonymQuizStart(){
  const base=(typeof SYNONYMS_A1!=='undefined'?SYNONYMS_A1:[]);
  const list=shuffle(base.slice());
  if(list.length<4){ toast('لا توجد مرادفات كافية بعد.'); return viewSynonyms(); }
  const rounds=list.slice(0,12);
  let idx=0, score=0;
  function draw(){
    if(idx>=rounds.length) return finish();
    const g=rounds[idx];
    const askFirst=Math.random()<0.5;
    const ask=askFirst?g[0]:g[1], correct=askFirst?g[1]:g[0];
    const distractors=shuffle(base.filter(x=>x!==g).map(x=>Math.random()<0.5?x[0]:x[1]).filter(w=>w!==ask&&w!==correct))
      .filter((w,i2,arr)=>arr.indexOf(w)===i2).slice(0,3);
    const opts=shuffle([correct,...distractors]);
    app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="back">‹ خروج</button></div>'+
     '<section class="sheet"><div class="qhead"><span class="qcount">'+(idx+1)+'/'+rounds.length+'</span>'+
     '<span class="pbar"><i style="width:'+Math.round(idx/rounds.length*100)+'%"></i></span></div>'+
     '<div class="qhint" style="text-align:center">ما الكلمة الأقرب في المعنى لِ</div>'+
     '<div class="bigword">'+esc(ask)+'</div>'+
     '<div style="display:grid;gap:8px;margin-top:14px">'+
     opts.map((o,i2)=>'<button class="btn wide" data-o="'+i2+'">'+esc(o)+'</button>').join('')+
     '</div></section>';
    $('#back').onclick=viewPractice;
    setTimeout(()=>speak(ask,{rate:0.75}),200);
    app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
      const picked=opts[+b.dataset.o]; const ok=picked===correct;
      if(ok){ score++; addXP(3); }
      const s=app.querySelector('.sheet');
      const d=document.createElement('div'); d.className='fb '+(ok?'ok':'no');
      d.innerHTML=ok?'✓ صحيح!':'الصحيح: <b>'+esc(correct)+'</b>'; s.appendChild(d);
      const nb=document.createElement('button'); nb.className='btn gold wide'; nb.style.marginTop='12px';
      nb.textContent='التالي ›'; nb.onclick=()=>{ idx++; draw(); }; s.appendChild(nb);
      app.querySelectorAll('[data-o]').forEach(x=>{x.disabled=true;});
    });
  }
  function finish(){
    addXP(10);
    const pct=Math.round(score/rounds.length*100);
    app.innerHTML='<section class="sheet" style="margin-top:30px"><div class="score">'+
      '<div class="big" style="color:'+(pct>=70?'var(--leaf)':'var(--plum)')+'">'+pct+'٪</div>'+
      '<div class="lab">'+score+' من '+rounds.length+'</div></div>'+
      '<div class="row" style="margin-top:14px;gap:8px">'+
      '<button class="btn gold" id="again" style="flex:1">أعد</button>'+
      '<button class="btn" id="b" style="flex:1">تم</button></div></section>';
    $('#again').onclick=()=>synonymQuizStart();
    $('#b').onclick=viewSynonyms;
  }
  draw();
}

      if(ok){ right++; addXP(3); }
      const s=app.querySelector('.sheet');
      const d=document.createElement('div'); d.className='fb '+(ok?'ok':'no');
      d.innerHTML=(ok?'✓ صحيح!':'الصحيح: <span class="en">'+esc(q.o[q.a])+'</span>')+(q.exp?'<div class="fb-exp">'+esc(q.exp)+'</div>':'');
      s.appendChild(d);
      const nb=document.createElement('button'); nb.className='btn gold wide'; nb.style.marginTop='12px';
      nb.textContent=idx<qs.length-1?'التالي ›':'النتيجة ›'; nb.onclick=()=>{ idx++; render(); }; s.appendChild(nb);
      try{nb.scrollIntoView({block:'nearest',behavior:'smooth'});}catch(e){}
    });
  }
  function finish(){
    S.reading=S.reading||{}; S.reading[i]=true; save();
    const pct=Math.round(right/qs.length*100);
    addXP(10);
    if(pct>=80){ try{confetti();}catch(e){} }
    app.innerHTML='<section class="sheet" style="margin-top:30px"><div class="score">'+
     '<div class="big" style="color:'+(pct>=70?'var(--leaf)':'var(--plum)')+'">'+pct+'٪</div>'+
     '<div class="lab">'+right+' إجابة صحيحة من '+qs.length+'</div></div>'+
     '<div class="row" style="margin-top:14px;gap:8px">'+
     '<button class="btn gold" id="again" style="flex:1">أعد</button>'+
     '<button class="btn" id="lst" style="flex:1">فقرات أخرى</button></div></section>';
    $('#again').onclick=()=>readingQuizStart(i);
    $('#lst').onclick=viewReadingList;
  }
  render();
}

/* يجمع كل مفردات فصول القصة (بلا تكرار) — تُستعمل في الألعاب التفاعلية أدناه */
function allBookVocab(){
  const seen={}, out=[];
  BOOK.forEach(c=>(c.vocab||[]).forEach(v=>{
    const key=v[0].toLowerCase();
    if(!seen[key]){ seen[key]=1; out.push(v); }
  }));
  return out;
}
/* ============ لعبة الذاكرة: اقلب بطاقتين وطابق كل كلمة إنكليزية بمعناها العربي ============ */
function viewMemoryGame(){
  stopSpeak(); paintDots(-1); setNav('practice'); window.scrollTo(0,0);
  const PAIRS=8;
  const pool=shuffle(allBookVocab()).slice(0,PAIRS);
  if(pool.length<4){ toast('لا توجد مفردات كافية بعد لهذه اللعبة.'); return viewPractice(); }
  let cards=[];
  pool.forEach((v,i)=>{ cards.push({id:i,text:v[0]}); cards.push({id:i,text:v[1]}); });
  cards=shuffle(cards);
  let flipped=[], matched={}, moves=0, busy=false;
  function draw(){
    app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="back">‹ تدرّب</button></div>'+
     '<section class="sheet"><h2><i>🎴</i> لعبة الذاكرة</h2>'+
     '<div class="note">اقلب بطاقتين لتجد الكلمة الإنكليزية ومعناها العربي المطابق. حاول بأقل عدد محاولات ممكن.</div>'+
     '<div class="row" style="margin:8px 0"><span class="diag">المحاولات: '+moves+'</span>'+
     '<span class="diag" style="margin-inline-start:auto">تطابق: '+Object.keys(matched).length+'/'+pool.length+'</span></div>'+
     '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px">'+
     cards.map((c,i)=>{
       const isMatched=!!matched[c.id];
       const isFlipped=flipped.indexOf(i)!==-1||isMatched;
       return '<button class="btn sm'+(isMatched?' gold':'')+'" data-i="'+i+'" style="min-height:56px;font-size:12.5px;line-height:1.3;'+(isMatched?'opacity:.55':'')+'"'+(isMatched?' disabled':'')+'>'+
         (isFlipped?esc(c.text):'❓')+'</button>';
     }).join('')+
     '</div></section>';
    $('#back').onclick=()=>viewPractice();
    app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>onPick(+b.dataset.i));
  }
  function onPick(i){
    if(busy||flipped.indexOf(i)!==-1||matched[cards[i].id]) return;
    flipped.push(i);
    if(flipped.length<2){ draw(); return; }
    moves++;
    const [a,b]=flipped;
    if(cards[a].id===cards[b].id){
      matched[cards[a].id]=true; flipped=[]; addXP(3);
      draw();
      if(Object.keys(matched).length===pool.length) setTimeout(finish,400);
    }else{
      busy=true; draw();
      setTimeout(()=>{ flipped=[]; busy=false; draw(); },900);
    }
  }
  function finish(){
    addXP(15);
    app.innerHTML='<section class="sheet" style="margin-top:30px;text-align:center">'+
     '<div style="font-size:44px">🎉</div><h2 style="justify-content:center">أحسنت!</h2>'+
     '<div class="note">أكملت اللعبة في '+moves+' محاولة.</div>'+
     '<div style="display:grid;gap:9px;margin-top:14px">'+
     '<button class="btn gold wide" id="again">العب مجدداً</button>'+
     '<button class="btn wide" id="back2">عودة</button></div></section>';
    $('#again').onclick=()=>viewMemoryGame();
    $('#back2').onclick=()=>viewPractice();
  }
  draw();
}
/* ============ لعبة رتّب الحروف: أعد بناء الكلمة من حروفها المبعثرة ============ */
function viewScrambleGame(){
  stopSpeak(); paintDots(-1); setNav('practice'); window.scrollTo(0,0);
  const ROUNDS=10;
  const words=shuffle(allBookVocab().filter(v=>/^[a-zA-Z]+$/.test(v[0])&&v[0].length>=3)).slice(0,ROUNDS);
  if(words.length<3){ toast('لا توجد كلمات كافية بعد لهذه اللعبة.'); return viewPractice(); }
  let idx=0, score=0, answer=[], letters=[];
  function setupRound(){
    const w=words[idx][0].toLowerCase();
    letters=shuffle(w.split('').map((ch,i)=>({ch:ch,i:i,used:false})));
    if(letters.map(l=>l.ch).join('')===w&&letters.length>1){ const t=letters[0]; letters[0]=letters[1]; letters[1]=t; }
    answer=[];
  }
  setupRound();
  function draw(){
    const w=words[idx][0], ar=words[idx][1];
    app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="back">‹ تدرّب</button></div>'+
     '<section class="sheet"><h2><i>🔤</i> رتّب الحروف</h2>'+
     '<div class="row"><span class="diag">السؤال '+(idx+1)+'/'+words.length+'</span>'+
     '<span class="diag" style="margin-inline-start:auto">النقاط: '+score+'</span></div>'+
     '<div class="note" style="margin-top:8px;text-align:center;font-size:15px">المعنى: <b>'+esc(ar)+'</b></div>'+
     '<div class="qtext en" style="text-align:center;letter-spacing:4px;min-height:34px;border-bottom:2px solid var(--gold,#B9862F);padding-bottom:8px">'+
     (answer.length?answer.map(a=>esc(a.ch)).join(''):'<span style="opacity:.35">?</span>')+'</div>'+
     '<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px">'+
     letters.map((l,i)=>'<button class="btn sm'+(l.used?' ghost':'')+'" data-l="'+i+'"'+(l.used?' disabled style="opacity:.25"':'')+'>'+esc(l.ch)+'</button>').join('')+
     '</div>'+
     '<div class="row" style="margin-top:14px;gap:8px">'+
     '<button class="btn ghost" id="undo" style="flex:1">⌫ تراجع</button>'+
     '<button class="btn" id="hearIt" style="flex:1">🔊 استمع</button></div>'+
     '</section>';
    $('#back').onclick=()=>viewPractice();
    $('#hearIt').onclick=()=>speak(w,{rate:0.72});
    $('#undo').onclick=()=>{ const last=answer.pop(); if(last) letters[last.i].used=false; draw(); };
    app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.l; if(letters[i].used) return;
      letters[i].used=true; answer.push(letters[i]);
      if(answer.length===letters.length) checkAnswer(); else draw();
    });
  }
  function checkAnswer(){
    const built=answer.map(a=>a.ch).join('').toLowerCase();
    const ok=built===words[idx][0].toLowerCase();
    if(ok) score++;
    app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="back">‹ تدرّب</button></div>'+
     '<section class="sheet" style="text-align:center">'+
     '<div style="font-size:40px">'+(ok?'✅':'❌')+'</div>'+
     '<h2 style="justify-content:center">'+(ok?'صحيح!':'ليست تماماً')+'</h2>'+
     '<div class="qtext en" style="text-align:center;margin-top:8px">'+esc(words[idx][0])+'</div>'+
     '<div class="note" style="text-align:center">'+esc(words[idx][1])+'</div>'+
     '<button class="btn gold wide" id="next" style="margin-top:16px">'+(idx<words.length-1?'التالي ›':'إنهاء')+'</button>'+
     '</section>';
    $('#back').onclick=()=>viewPractice();
    $('#next').onclick=()=>{
      idx++;
      if(idx>=words.length) return finish();
      setupRound(); draw();
    };
  }
  function finish(){
    addXP(score*3);
    app.innerHTML='<section class="sheet" style="margin-top:30px;text-align:center">'+
     '<div style="font-size:44px">🏁</div><h2 style="justify-content:center">النتيجة النهائية</h2>'+
     '<div class="big" style="font-size:34px;color:var(--leaf);margin-top:8px">'+score+'/'+words.length+'</div>'+
     '<div style="display:grid;gap:9px;margin-top:14px">'+
     '<button class="btn gold wide" id="again">العب مجدداً</button>'+
     '<button class="btn wide" id="back2">عودة</button></div></section>';
    $('#again').onclick=()=>viewScrambleGame();
    $('#back2').onclick=()=>viewPractice();
  }
  draw();
}


/* يحدّث صفاً واحداً ويرفعه إلى أعلى القائمة بلا إعادة رسم الصفحة */
function refreshRow(btn, html){
  const row=btn.closest('.ul-item'); if(!row) return;
  const list=row.parentNode;
  const tmp=document.createElement('div'); tmp.innerHTML=html;
  const fresh=tmp.firstElementChild; if(!fresh) return;
  row.replaceWith(fresh);
  const first=list.querySelector('.ul-item');
  if(first && first!==fresh) list.insertBefore(fresh,first);
  fresh.classList.add('lift');
  setTimeout(()=>fresh.classList.remove('lift'),700);
  wireDictRow(fresh);
}
function wireDictRow(row){
  row.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say,{rate:0.72}));
  row.querySelectorAll('[data-wk]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.wk; S.known=S.known||{};
    if(isKnown(k)) delete S.known[k]; else { S.known[k]=1; delete S.cards[k]; }
    save(); refreshRow(b, dictWordRow(k)); bumpCounts();
  });
  row.querySelectorAll('[data-wr]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.wr;
    if(inReview(k)) delete S.cards[k]; else { delete (S.known||{})[k]; addCard(WORDS[k].t,WORDS[k].ar,-1); }
    save(); refreshRow(b, dictWordRow(k)); bumpCounts();
  });
  row.querySelectorAll('[data-sr]').forEach(b=>b.onclick=()=>{
    const s=SENTS.find(x=>x.key===b.dataset.sr); if(!s) return;
    const k=cardKey(s.en);
    if(S.cards[k]) delete S.cards[k]; else addCard(s.en,s.ar,s.ci);
    save(); refreshRow(b, dictSentRow(s)); bumpCounts();
  });
}
/* يحدّث العدّادات العلوية فقط */
function bumpCounts(){
  let st;
  if(S.dictF&&S.dictF.tab==='sents'){
    const know=SENTS.filter(s=>isSentKnown(s.en)).length;
    st=[know, SENTS.length-know, SENTS.filter(s=>!!S.cards[cardKey(s.en)]).length];
  }else{
    const keys=Object.keys(WORDS).filter(k=>WORDS[k].t.toLowerCase()===k);
    st=[keys.filter(k=>isKnown(k)).length, keys.filter(k=>!isKnown(k)).length,
        keys.filter(k=>inReview(k)).length];
  }
  app.querySelectorAll('.stats .stat .n').forEach((el,i)=>{ if(st[i]!=null) el.textContent=st[i]; });
  paintHead();
}

  });

  });

    let n=0; pool.slice(0,200).forEach(k=>{ if(!inReview(k)){ delete (S.known||{})[k]; addCard(WORDS[k].t,WORDS[k].ar,-1); n++; } });

}

function genericQuiz(qs,title){
  stopSpeak(); window.scrollTo(0,0);
  let i=0, right=0, wrong=[], pass=1;
  function draw(){
    if(i>=qs.length){
      if(wrong.length&&pass<5){ pass++; qs=shuffle(wrong.slice()); wrong=[]; i=0;
        app.innerHTML='<section class="sheet" style="margin-top:30px;text-align:center">'+
          '<div style="font-size:40px">🔁</div><h2 style="justify-content:center">جولة تصحيح '+(pass-1)+'</h2>'+
          '<p style="font-size:13px;color:var(--muted)">بقي '+qs.length+' — ما تصحّحه لن يعود.</p>'+
          '<button class="btn gold wide" id="g">تابع</button></section>';
        return $('#g').onclick=draw;
      }
      return done();
    }
    const q=qs[i];
    if(!q._o){ const idx=shuffle(q.o.map((_,n)=>n)); q._o=idx.map(n=>q.o[n]); q._a=idx.indexOf(q.a); }
    app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="back">‹ خروج</button></div>'+
    '<section class="sheet"><div class="qhead"><span class="qcount">'+(i+1)+'/'+qs.length+'</span>'+
    '<span class="pbar"><i style="width:'+Math.round(i/qs.length*100)+'%"></i></span></div>'+
    '<div class="qtype">'+title+'</div><div class="qtext en">'+esc(q.q)+'</div>'+
    '<div class="qhint">'+(q.hint||'')+'</div><div class="opts">'+
    q._o.map((o,n)=>'<button class="opt" data-n="'+n+'"><span class="en">'+esc(o)+'</span></button>').join('')+'</div></section>';
    $('#back').onclick=viewPractice;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=+b.dataset.n===q._a;
      app.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(+x.dataset.n===q._a)x.classList.add('ok');});
      if(!ok) b.classList.add('no');
      if(pass===1&&ok){right++;addXP(4);}
      if(!ok){ wrong.push(q); if(pass===1) addCard(q.o[q.a],q.hint||'',q._ci); }
      speak(q.o[q.a]);
      const s=app.querySelector('.sheet');
      const d=document.createElement('div'); d.className='fb '+(ok?'ok':'no');
      d.innerHTML=ok?'صحيح ✓':'الجواب: <span class="en">'+esc(q.o[q.a])+'</span>'; s.appendChild(d);
      const nb=document.createElement('button'); nb.className='btn '+(ok?'gold':'')+' wide';
      nb.style.marginTop='12px'; nb.textContent='التالي ›';
      nb.onclick=()=>{ delete q._o; i++; draw(); }; s.appendChild(nb);
    });
  }
  function done(){
    const pct=Math.round(right/Math.max(1,qs.length)*100);
    app.innerHTML='<section class="sheet" style="margin-top:30px"><div class="score">'+
      '<div class="big">'+pct+'٪</div><div class="lab">'+right+' صحيحة</div></div>'+
      '<button class="btn gold wide" id="b" style="margin-top:14px">تم</button></section>';
    $('#b').onclick=viewPractice;
  }
  draw();
}

/* مقارنة كلمة بكلمة تُظهر موضع الخطأ */
function diffWords(user,target){
  const u=norm(user).split(' ').filter(Boolean), t=norm(target).split(' ').filter(Boolean);
  const orig=target.split(' ');
  let hits=0;
  const html=orig.map((w,i)=>{
    const good=u[i]&&u[i]===t[i];
    if(good) hits++;
    return '<span class="dw '+(good?'ok':'bad')+'">'+esc(w)+'</span>';
  }).join(' ');
  return {html:html, pct:Math.round(hits/Math.max(1,t.length)*100), perfect:hits===t.length&&u.length===t.length};
}

/* يحلّل فقرة المستخدم بقواعد بسيطة وموثوقة (بلا حاجة لذكاء اصطناعي أو اتصال إنترنت):
   الطول، عدد الجمل، تنوّع استخدام المفردات المقترحة، الحرف الكبير في بداية كل جملة، علامة ترقيم ختامية، وضمير I كبيراً دائماً */
function analyzeParagraph(text,p){
  const trimmed=text.trim();
  const words=trimmed.split(/\s+/).filter(Boolean);
  const wordCount=words.length;
  const sentences=trimmed.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean);
  const sentenceCount=sentences.length;
  const targetHits=p.target.filter(w=>new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(trimmed));
  const checks=[
    {k:'words',label:'الطول: '+wordCount+' كلمة (المطلوب '+p.minWords+'+)',ok:wordCount>=p.minWords},
    {k:'sentences',label:'عدد الجمل: '+sentenceCount+' (المطلوب '+p.minSentences+'+)',ok:sentenceCount>=p.minSentences},
    {k:'vocab',label:'استخدمتَ '+targetHits.length+' من '+p.target.length+' كلمات مقترحة',ok:targetHits.length>=Math.min(2,p.target.length)},
    {k:'cap',label:'كل جملة تبدأ بحرف كبير',ok:sentences.length>0 && sentences.every(s=>/^[A-Z]/.test(s))},
    {k:'punct',label:'الفقرة تنتهي بعلامة ترقيم (. أو ! أو ؟)',ok:/[.!?]\s*$/.test(trimmed)},
    {k:'capI',label:'ضمير I مكتوب دائماً بحرف كبير',ok:!/(^|\s)i(\s|$|[.,!?'])/.test(text)}
  ];
  const passed=checks.filter(c=>c.ok).length;
  const pct=Math.round(passed/checks.length*100);
  return {checks:checks,pct:pct,passed:passed,total:checks.length,wordCount:wordCount,sentenceCount:sentenceCount,targetHits:targetHits};
}
function viewParagraphWrite(idx){
  stopSpeak(); window.scrollTo(0,0);
  const p=WRITING_PROMPTS[idx];
  app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="back">‹ المواضيع</button>'+

   '<section class="sheet"><h2 style="font-size:17px">'+esc(p.t_ar)+'</h2>'+

   '<textarea class="tin" id="para" rows="8" autocomplete="off" spellcheck="false" style="margin-top:12px;direction:ltr;text-align:left;font-size:15px" placeholder="Write your paragraph here..."></textarea>'+

   '<button class="btn gold wide" id="chk" style="margin-top:10px">تحقّق من فقرتي</button>'+
   '<div id="fbBox" style="margin-top:12px"></div></section>';
  $('#back').onclick=()=>viewParagraphSetup();

    const r=analyzeParagraph(text,p);
    S.writingDone=S.writingDone||[];
    S.writingDone.push({idx:idx,at:Date.now(),pct:r.pct});
    if(S.writingDone.length>200) S.writingDone=S.writingDone.slice(-200);
    save();
    if(r.pct>=60) addXP(8);
    if(r.pct>=80){ try{confetti();}catch(e){} }
    logAttempt({title:'كتابة فقرة: '+p.t_ar,pct:r.pct,right:r.passed,total:r.total});
    $('#fbBox').innerHTML='<div class="score" style="margin:6px 0"><div class="big" style="color:'+(r.pct>=60?'var(--leaf)':'var(--plum)')+'">'+r.pct+'٪</div>'+
      '<div class="lab">'+r.passed+' من '+r.total+' معايير محقّقة</div></div>'+
      r.checks.map(c=>'<div class="fb '+(c.ok?'ok':'no')+'" style="margin-top:6px">'+(c.ok?'✅ ':'⚠️ ')+esc(c.label)+'</div>').join('')+
      '<div class="row" style="margin-top:14px;gap:8px">'+
      '<button class="btn gold" id="another" style="flex:1">موضوع آخر</button>'+
      '<button class="btn" id="retry" style="flex:1">أعد الكتابة</button></div>';
    $('#another').onclick=()=>viewParagraphSetup();
    $('#retry').onclick=()=>viewParagraphWrite(idx);
    try{ $('#fbBox').scrollIntoView({block:'nearest',behavior:'smooth'}); }catch(e){}
  };
}

function spellDrill(words,title){
  stopSpeak(); window.scrollTo(0,0);
  const list=shuffle(words.slice());
  let i=0, ok=0;
  function draw(){
    if(i>=list.length) return done();
    const w=list[i];
    app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="back">‹ رجوع</button></div>'+
    '<section class="sheet"><div class="qhead"><span class="qcount">'+(i+1)+'/'+list.length+'</span>'+
    '<span class="pbar"><i style="width:'+Math.round(i/list.length*100)+'%"></i></span></div>'+
    '<div class="qtype">'+esc(title)+'</div>'+
    '<div class="qtext" style="text-align:center">استمع واكتب الكلمة</div>'+
    '<div class="row" style="gap:8px;margin:12px 0"><button class="btn gold sm" id="rep" style="flex:1">🔊 أعد</button>'+
    '<button class="btn ghost sm" id="sp" style="flex:1">🔤 تهجئة حرفاً حرفاً</button></div>'+
    '<input class="tin" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="اكتب هنا">'+
    '<button class="btn gold wide" id="chk" style="margin-top:12px">تحقّق</button></section>';
    $('#back').onclick=viewSpellRules;
    const p=()=>speak(w,{rate:0.6});
    $('#rep').onclick=p; setTimeout(p,400);
    $('#sp').onclick=()=>speak(w.split('').join(', '),{rate:0.55});
    const go=()=>{
      const val=$('#ans').value, good=norm(val)===norm(w);
      if(good){ok++;addXP(3);} else addCard(w,'',-1);
      $('#ans').disabled=true; $('#chk').disabled=true;
      const sh=app.querySelector('.sheet');
      const d=document.createElement('div'); d.className='fb '+(good?'ok':'no');
      d.innerHTML=good?'صحيح ✓':'الصحيح: <span class="en">'+esc(w)+'</span>'+
        '<div class="dline">'+w.split('').map((c,n)=>{
          const uc=(val||'').toLowerCase()[n];
          return '<span class="dc '+(uc===c.toLowerCase()?'ok':'bad')+'">'+esc(c)+'</span>';}).join('')+'</div>';
      sh.appendChild(d); speak(w,{rate:0.6});
      const nb=document.createElement('button'); nb.className='btn '+(good?'gold':'')+' wide';
      nb.style.marginTop='12px'; nb.textContent='التالي ›'; nb.onclick=()=>{i++;draw();}; sh.appendChild(nb);
    };
    $('#chk').onclick=go;
    $('#ans').onkeydown=e=>{ if(e.key==='Enter') go(); };
  }
  function done(){
    const pct=Math.round(ok/list.length*100);
    app.innerHTML='<section class="sheet" style="margin-top:30px"><div class="score">'+
      '<div class="big" style="color:'+(pct>=70?'var(--leaf)':'var(--plum)')+'">'+pct+'٪</div>'+
      '<div class="lab">'+ok+' من '+list.length+'</div></div>'+
      '<div class="row" style="margin-top:14px;gap:8px"><button class="btn gold" id="a" style="flex:1">أعد</button>'+
      '<button class="btn" id="b" style="flex:1">تم</button></div></section>';
    $('#a').onclick=()=>spellDrill(words,title);
    $('#b').onclick=viewSpellRules;
  }
  draw();
}

/* المناطق التي نفعّل فيها النقر — نستثني أزرار الاختيار حتى لا يتعارض النقر مع الإجابة */
const TAP_SEL = '.gtable td, .note, .qtext, .fb, .bigword, .pg .lab, .exp-text, .wp-m, .qhint-en';
const TAP_SKIP = 'button, .opt, .mcell, .tok, .seg, .wchip, .vc, .vc-card, .rtxt, nav, .card-ch, .node, .wpop';

function wrapWords(el){
  if(el.dataset.tapped) return;
  el.dataset.tapped='1';
  const walk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);
  const nodes=[];
  let n; while(n=walk.nextNode()){
    if(n.parentElement.closest(TAP_SKIP)&&n.parentElement.closest(TAP_SKIP)!==el) continue;
    if(n.parentElement.classList&&n.parentElement.classList.contains('tw')) continue;
    if(/[A-Za-z]{2}/.test(n.nodeValue)) nodes.push(n);
  }
  nodes.forEach(t=>{
    const frag=document.createDocumentFragment();
    t.nodeValue.split(/(\s+)/).forEach(part=>{
      if(/[A-Za-z]{2}/.test(part)){
        const s=document.createElement('span');
        s.className='tw'; s.textContent=part;
        frag.appendChild(s);
      }else frag.appendChild(document.createTextNode(part));
    });
    t.parentNode.replaceChild(frag,t);
  });
}
function makeTappable(root){
  (root||document).querySelectorAll(TAP_SEL).forEach(el=>{
    if(el.closest('.wpop')) return;
    try{ wrapWords(el); }catch(e){}
  });
}

let TAP_TIMER=null;
function startTapObserver(){

/* إتقان كل قسم بالاستناد إلى S.qStatus (نتائج كل سؤال أُجيب عنه سابقاً في أي وضع تدريب) */
const CAT_META={
  grammar:{label:'القواعد',pfx:'g',official:true,w:12},
  functions:{label:'الوظائف اللغوية',pfx:'f',official:true,w:8},
  dialogues:{label:'المحادثات الكتابية',pfx:'dl',official:true,w:8},

  direct:{label:'أسئلة مباشرة (إضافي)',pfx:'d',official:false,w:0},
  idioms:{label:'تعابير اصطلاحية (إضافي)',pfx:'i',official:false,w:0},
};
/* صعوبة كل موضوع (tag) حسب منهج منظم — تقييم لغوي/تربوي لكل موضوع نحوي أو وظيفي على حدة.
   للأقسام بلا tag (تعابير اصطلاحية، فهم مقروء) تُحسب الصعوبة تلقائياً بمعيار تقريبي (طول العبارة/النص). */
const DIFF_TAG={
 grammar:{
  'أقسام الكلام':'easy','المفردات':'easy','الكميات':'easy','صيغ المقارنة':'easy','الضمائر والأعداد':'easy',
  'عام':'medium','حروف الجر والزمن':'medium','الأفعال الناقصة':'medium','الضمائر الموصولة':'medium',
  'الأزمنة':'medium','القواعد':'medium','الروابط':'medium','المصادر والأفعال':'medium',
  'الكلام المنقول':'hard','القواعد المتقدمة':'hard','جمل التمني':'hard','الجمل الشرطية':'hard',
  'المبني للمجهول':'hard','الأفعال المركبة':'hard'
 },
 direct:{
  'مفردات':'easy','معرفة عامة':'easy','حوار':'easy','أدوات التعريف':'easy','الكميات':'easy','صيغ المقارنة':'easy','الأعداد والترتيب':'easy',
  'قواعد':'medium','حروف الجر':'medium','المصادر والأفعال':'medium',
  'تعبير مجازي':'hard','القواعد المتقدمة':'hard'
 },
 functions:{
  'الأوامر والطلبات':'easy','التأكيد والموافقة':'easy','العرض والطلب':'easy','الاعتذار':'easy','الدهشة والتعجب':'easy','الثناء والمديح':'easy',
  'الرفض والاعتراض':'medium','اللوم والانتقاد':'medium','التحذير والتهديد':'medium','المشاعر والتعازي':'medium',
  'الرأي والنصيحة':'medium','التخمين والاحتمال':'medium','التصحيح والتوضيح':'medium'
 },
 dialogues:{
  'تحيات وتعارف':'easy','طلب المساعدة والعروض':'easy','الدعوات':'easy','الاعتذار':'easy','التسوق':'easy','الشكر':'easy','في المطعم':'easy',
  'الشكوى والاعتراض':'medium','الاتجاهات':'medium','الهاتف':'medium','الموافقة والرفض':'medium','الاقتراحات والنصائح':'medium',
  'الرأي والنقاش':'hard'
 }
};
const DIFF_LABEL={easy:'سهل 🟢',medium:'متوسط 🟡',hard:'صعب 🔴'};
/* يحسب صعوبة سؤال واحد: عبر خريطة الموضوع (tag) إن وُجدت، أو معيار تقريبي بالطول للأقسام بلا tag */
function questionDifficulty(catKey,q){
  if(DIFF_TAG[catKey]&&q.tag&&DIFF_TAG[catKey][q.tag]) return DIFF_TAG[catKey][q.tag];
  if(catKey==='idioms'){
    const m=/"([^"]{2,80})"/.exec(q.q);
    const words=m?m[1].trim().split(/\s+/).length:3;
    return words<=2?'easy':(words===3?'medium':'hard');
  }
  return 'medium';
}
/* يحسب صعوبة قطعة فهم مقروء تقريبياً من طول نصها (عدد الكلمات) — معيار تقريبي وليس تقييماً لغوياً دقيقاً */
function passageDifficulty(p){
  const words=String(p.text||'').trim().split(/\s+/).length;
  return words<150?'easy':(words<300?'medium':'hard');
}
function categoryMastery(){
  S.qStatus=S.qStatus||{};
  const out={};
  Object.keys(CAT_META).forEach(key=>{
    const meta=CAT_META[key];
    let total=0,attempted=0,correct=0;
    if(key==='passages'){
      (EXAM.passages||[]).forEach(p=>(p.q||[]).forEach(q=>{
        total++; const st=S.qStatus[q._id]; if(st){attempted++; if(st==='correct')correct++;}
      }));
    } else {
      (EXAM[key]||[]).forEach(q=>{
        total++; const st=S.qStatus[q._id]; if(st){attempted++; if(st==='correct')correct++;}
      });
    }
    out[key]={label:meta.label,official:meta.official,w:meta.w,total:total,attempted:attempted,correct:correct,
      acc:attempted?Math.round(correct/attempted*100):null, cov:total?Math.round(attempted/total*100):0};
  });
  return out;
}
/* تقدير جاهزية مركّب من الأقسام الأربعة الرسمية فقط، مرجّح بحسب وزن كل قسم في الاختبار الحقيقي (١٢/٨/٨/١٢ من ٤٠) */
function readinessEstimate(m){
  let wsum=0,asum=0,anyAttempt=false;
  Object.keys(m).forEach(k=>{
    const c=m[k]; if(!c.official||!c.w) return;
    wsum+=c.w;
    if(c.acc!=null){ anyAttempt=true; asum+=c.acc*c.w; }
  });
  if(!anyAttempt) return null;
  return Math.round(asum/wsum);
}
/* قائمة أوسمة/إنجازات تحفيزية — محسوبة كل مرة من بيانات المستخدم الفعلية، لا تُخزَّن كحالة منفصلة */
function computeBadges(){
  const E=examStats();
  const m=categoryMastery();
  const readiness=readinessEstimate(m);
  const mastered=Object.keys(S.cards||{}).filter(k=>S.cards[k].lv>=4).length;
  const doneP=Object.keys(E.done).length;
  const officialAttempted=Object.keys(m).filter(k=>m[k].official&&m[k].acc!=null).length;
  const bestMock=(E.mockHistory||[]).reduce((mx,h)=>Math.max(mx,h.pct),0);
  const list=[
    {icon:'🔥',label:'٣ أيام متتالية',earned:(S.streak||0)>=3},
    {icon:'🔥',label:'٧ أيام متتالية',earned:(S.streak||0)>=7},

    {icon:'⭐',label:'١٠٠ نقطة خبرة',earned:(S.xp||0)>=100},
    {icon:'⭐',label:'٥٠٠ نقطة خبرة',earned:(S.xp||0)>=500},
    {icon:'⭐',label:'١٠٠٠ نقطة خبرة',earned:(S.xp||0)>=1000},
    {icon:'🎓',label:'أول امتحان تجريبي كامل',earned:(E.mockHistory||[]).length>=1},
    {icon:'🏆',label:'٦٠٪ فأعلى في امتحان تجريبي',earned:bestMock>=60},
    {icon:'🏆',label:'٨٠٪ فأعلى في امتحان تجريبي',earned:bestMock>=80},
    {icon:'📐',label:'تدرّبت في الأقسام الرسمية الأربعة',earned:officialAttempted>=4},
    {icon:'🧠',label:'جاهزية تقديرية ٧٠٪+',earned:readiness!=null&&readiness>=70},
    {icon:'📖',label:'أنهيت كل قطع الفهم المقروء',earned:EXAM.passages.length>0&&doneP>=EXAM.passages.length},
    {icon:'🗂️',label:'٥٠ كلمة شبه محفوظة في قاموسي',earned:mastered>=50},
  ];
  return list;
}

  const d=Math.ceil((new Date(S.examDate+'T00:00:00').getTime()-Date.now())/864e5);
  return isNaN(d)?null:d;

function autoDifficultyFor(catKey){
  const m=categoryMastery(); const c=m[catKey];
  if(!c||c.acc==null) return 'medium';
  if(c.acc<50) return 'easy';
  if(c.acc<75) return 'medium';
  return 'hard';
}

/* --- امتحان تجريبي كامل — يحاكي بنية الاختبار الوطني الحقيقي (٤٠ سؤالاً / ٦٠ دقيقة / ٤ أقسام) --- */
/* عشوائية حقيقية + عدم تكرار قريب: كل محاولة تتجنّب أسئلة آخر محاولة (أو محاولتين) قدر الإمكان،
   حتى لو كان بنك الأسئلة كبيراً، لضمان أن الامتحان لا "يشعر" بأنه نفسه في كل مرة. */
function pickBankSection(bankKey,n,secLabel,avoidIds){
  const all=(EXAM[bankKey]||[]).slice();
  let pool=avoidIds&&avoidIds.size?all.filter(q=>!avoidIds.has(q._id)):all;
  if(pool.length<n) pool=all; /* البنك صغير جداً لتجنّب التكرار كاملاً — ارجع للكل بدل الفشل */
  return shuffle(pool).slice(0,n).map(q=>Object.assign({},q,{_sec:secLabel}));
}
function pickPassageSection(target,avoidIds){
  const allPassages=EXAM.passages.slice();
  const fresh=allPassages.filter(p=>!(p.q||[]).every(q=>avoidIds&&avoidIds.has(q._id)));
  const pool=shuffle(fresh.length?fresh:allPassages);
  let qs=[],texts=[];
  for(const p of pool){
    if(qs.length>=target) break;
    const need=target-qs.length;
    let cand=shuffle(p.q.slice());
    if(avoidIds&&avoidIds.size){
      const notSeen=cand.filter(q=>!avoidIds.has(q._id));
      if(notSeen.length) cand=notSeen;
    }
    const chosen=cand.slice(0,Math.min(need,cand.length));
    if(!chosen.length) continue;
    qs=qs.concat(chosen.map(q=>Object.assign({},q,{_sec:'الفهم المقروء'})));
    texts.push(p.text);
  }
  return {qs:qs,texts:texts};
}

/* --- شاشة إعداد عامة (عدد + موضوع + حالة) لأي بنك أسئلة مستقل --- */
function genericExamSetup(key, label, icon){
  stopSpeak(); window.scrollTo(0,0);
  const bank=EXAM[key]||[];
  if(!bank.length){
    app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="back">‹ الاختبار</button></div>'+
     '<section class="sheet" style="margin-top:24px"><div class="empty">لا توجد أسئلة بعد في '+esc(label)+'.</div></section>';
    return $('#back').onclick=viewExam;
  }
  const hasTags=bank.some(q=>q.tag);
  const tags=hasTags?[...new Set(bank.map(q=>q.tag||'عام'))].sort((a,b)=>a.localeCompare(b,'ar')):[];
  const counts=[...new Set([10,20,40,bank.length])].filter(n=>n<=bank.length||n===bank.length);
  let stepN=1;
  app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="back">‹ الاختبار</button>'+
   '<h2 style="margin:12px 0 4px;font-size:21px">'+esc(icon)+' '+esc(label)+'</h2>'+
   '<p style="color:#9FC7C1;font-size:13px;margin:0">'+bank.length+' سؤالاً.</p></div>'+
   '<section class="sheet"><h2><i>'+(stepN++)+'</i> كم سؤالاً؟</h2>'+
   '<div class="segs">'+counts.map((n,i)=>'<button class="seg '+(i===1?'on':'')+'" data-n="'+n+'">'+(n===bank.length?'الكل':n)+'</button>').join('')+'</div>'+
   '<h2 style="margin-top:18px"><i>'+(stepN++)+'</i> مستوى الصعوبة</h2>'+
   '<div class="segs"><button class="seg on" data-diff="all">الكل</button>'+
   '<button class="seg" data-diff="easy">'+DIFF_LABEL.easy+'</button>'+
   '<button class="seg" data-diff="medium">'+DIFF_LABEL.medium+'</button>'+
   '<button class="seg" data-diff="hard">'+DIFF_LABEL.hard+'</button>'+
   '<button class="seg" data-diff="auto">🎯 تلقائي (يتكيّف مع أدائك)</button></div>'+
   (hasTags?('<h2 style="margin-top:18px"><i>'+(stepN++)+'</i> أي موضوع؟ (يمكن اختيار أكثر من واحد)</h2>'+
   '<div class="segs" id="tagWrap" style="flex-wrap:wrap"><button class="seg on" data-tag="__all">الكل</button>'+
     tags.map(t=>'<button class="seg" data-tag="'+esc(t)+'">'+esc(t)+' <span style="opacity:.7;font-size:10px">'+esc(DIFF_LABEL[DIFF_TAG[key]&&DIFF_TAG[key][t]||'medium'])+'</span></button>').join('')+'</div>'):'')+
   '<h2 style="margin-top:18px"><i>'+(stepN++)+'</i> حالة الأسئلة</h2>'+
   '<div class="segs"><button class="seg on" data-st="all">الكل</button>'+
   '<button class="seg" data-st="new">لم تُختبر بعد</button>'+
   '<button class="seg" data-st="wrong">أخطأت فيها سابقاً</button>'+
   '<button class="seg" data-st="correct">أجبت عنها صح</button></div>'+
   '<button class="btn gold wide" id="go" style="margin-top:18px">ابدأ</button></section>';
  $('#back').onclick=viewExam;
  let n=Math.min(20,bank.length),selTags=null,st='all',diff='all';
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{n=+b.dataset.n;
    app.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('on',x===b));});
  app.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{diff=b.dataset.diff;
    app.querySelectorAll('[data-diff]').forEach(x=>x.classList.toggle('on',x===b));});
  if(hasTags){
    const tagBtns=[...app.querySelectorAll('[data-tag]')];
    const allBtn=tagBtns.find(x=>x.dataset.tag==='__all');
    tagBtns.forEach(b=>b.onclick=()=>{
      if(b===allBtn){ selTags=null; tagBtns.forEach(x=>x.classList.toggle('on',x===allBtn)); return; }
      allBtn.classList.remove('on'); b.classList.toggle('on');
      const on=tagBtns.filter(x=>x!==allBtn&&x.classList.contains('on')).map(x=>x.dataset.tag);
      if(!on.length){ selTags=null; allBtn.classList.add('on'); } else selTags=on;
    });
  }
  app.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{st=b.dataset.st;
    app.querySelectorAll('[data-st]').forEach(x=>x.classList.toggle('on',x===b));});
  $('#go').onclick=()=>{
    S.qStatus=S.qStatus||{};
    let base=selTags?bank.filter(q=>selTags.includes(q.tag||'عام')):bank.slice();
    let effDiff=diff;
    if(diff==='auto'){ effDiff=autoDifficultyFor(key); toast('تم اختيار المستوى «'+DIFF_LABEL[effDiff]+'» تلقائياً بحسب أدائك'); }
    if(effDiff!=='all') base=base.filter(q=>questionDifficulty(key,q)===effDiff);
    if(st==='new') base=base.filter(q=>!S.qStatus[q._id]);
    else if(st==='wrong') base=base.filter(q=>S.qStatus[q._id]==='wrong');
    else if(st==='correct') base=base.filter(q=>S.qStatus[q._id]==='correct');
    if(!base.length){ toast('لا توجد أسئلة مطابقة لهذا الفلتر'); base=bank.slice(); }
    examQuiz(shuffle(base).slice(0,n).map(q=>Object.assign({},q)), label);
  };
}

/* محادثة تفاعلية متسلسلة — تسلسل تبادلات من نفس موضوع الحوار، معروضة كفقاعات دردشة حقيقية بدل شاشة أسئلة عادية.

   لكنها تُحاكي إحساس المحادثة الفعلية بردود فعل فورية على كل اختيار. */
function viewDialogueChat(){
  stopSpeak(); window.scrollTo(0,0);
  const tags=[...new Set((EXAM.dialogues||[]).map(q=>q.tag||'عام'))].filter(t=>EXAM.dialogues.filter(q=>(q.tag||'عام')===t).length>=4);
  app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="back">‹ الاختبار</button>'+
   '<h2 style="margin:12px 0 4px;font-size:21px">💬 محادثة تفاعلية</h2>'+
   '<p style="color:#9FC7C1;font-size:13px;margin:0">اختر موضوعاً وعِش تبادلاً متتالياً من الردود كأنك في محادثة حقيقية.</p></div>'+
   '<section class="sheet"><div class="grid" style="grid-template-columns:1fr">'+
   tags.map(t=>'<button class="card-ch" data-t="'+esc(t)+'"><span class="thumb" style="background:#2F8F8A;font-size:22px">💬</span>'+
     '<span class="meta"><h3>'+esc(t)+'</h3></span><span class="tick">›</span></button>').join('')+
   '</div></section>';
  $('#back').onclick=viewExam;
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>runDialogueChat(b.dataset.t));
}
function runDialogueChat(tag){
  stopSpeak(); window.scrollTo(0,0);
  const pool=shuffle(EXAM.dialogues.filter(q=>(q.tag||'عام')===tag)).slice(0,5);
  let i=0,right=0;
  const transcript=[];
  function draw(){
    if(i>=pool.length) return done();
    const q=pool[i];
    const parts=String(q.q).split(/\n/);
    const aLine=parts[0]||'';
    app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="quit">‹ خروج</button>'+
     '<div style="font-size:11px;color:var(--saffron);margin-top:8px">'+esc(tag)+' · '+(i+1)+'/'+pool.length+'</div></div>'+
     '<section class="sheet"><div class="chatlog">'+
     transcript.map(t=>'<div class="bub '+t.who+'">'+t.html+'</div>').join('')+
     '<div class="bub a">'+esc(aLine)+'</div>'+
     '</div>'+
     '<div class="opts" style="margin-top:12px">'+q.o.map((o,n)=>'<button class="opt" data-n="'+n+'"><span class="en">'+esc(o)+'</span></button>').join('')+'</div>'+
     '</section>';
    $('#quit').onclick=viewExam;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const n=+b.dataset.n, ok=n===q.a;
      app.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(+x.dataset.n===q.a)x.classList.add('ok');});
      if(!ok) b.classList.add('no');
      if(ok){right++;addXP(3);}
      transcript.push({who:'a',html:esc(aLine)});
      transcript.push({who:'b'+(ok?' ok':' no'),html:esc(q.o[n])+(q.exp?'<div class="fb-exp" style="margin-top:4px">'+esc(q.exp)+'</div>':'')});
      setTimeout(()=>{ i++; draw(); },900);
    });
  }
  function done(){
    const pct=Math.round(right/pool.length*100);
    app.innerHTML='<section class="sheet" style="margin-top:30px"><div class="score">'+
     '<div class="big" style="color:'+(pct>=70?'var(--leaf)':'var(--plum)')+'">'+pct+'٪</div>'+
     '<div class="lab">'+right+' من '+pool.length+' ردّاً مناسباً</div></div>'+
     '<button class="btn gold wide" id="again" style="margin-top:14px">محادثة أخرى</button>'+
     '<button class="btn wide" id="b" style="margin-top:8px">عودة للاختبار</button></section>';
    $('#again').onclick=()=>runDialogueChat(tag);
    $('#b').onclick=viewExam;
  }
  draw();
}

function tipFor(q,title){
  if(q&&q.tag&&TIPS.tag[q.tag]) return TIPS.tag[q.tag];
  if(title&&TIPS.cat[title]) return TIPS.cat[title];
  return null;
}
/* يستخرج عينة تعابير اصطلاحية موجزة (العبارة + معناها الصحيح) من بنك الأسئلة، للعرض السريع في المراجعة */
function sampleIdioms(n){
  const out=[];
  for(const q of EXAM_IDIOMS){
    const m=/"([^"]{2,60})"/.exec(q.q);
    if(!m) continue;
    out.push({phrase:m[1].trim(), meaning:q.o[q.a]});
    if(out.length>=n) break;
  }
  return out;
}

/* يبحث عن سؤال بمعرّفه (_id) عبر كل البنوك — يُستخدم لبناء وضع "الأسئلة الأكثر تكراراً للخطأ" */
function findQuestionById(id){
  /* أسئلة مصدرها فصول القصة نفسها (اختبار الفصل ch، اختبار الوحدة ut، التدريب المتداخل il) */
  const cm=/^(ch|ut|il)(\d+)q(\d+)$/.exec(id);
  if(cm){ const c=BOOK[+cm[2]]; return c&&c.quiz&&c.quiz[+cm[3]]; }
  const mp=/^p(\d+)q(\d+)$/.exec(id);
  if(mp){ const p=EXAM.passages[+mp[1]]; return p&&p.q[+mp[2]]; }
  if(id.startsWith('dl')) return EXAM.dialogues[+id.slice(2)];
  if(id.startsWith('g')) return EXAM.grammar[+id.slice(1)];
  if(id.startsWith('f')) return EXAM.functions[+id.slice(1)];
  if(id.startsWith('i')) return EXAM.idioms[+id.slice(1)];
  if(id.startsWith('d')) return EXAM.direct[+id.slice(1)];
  return null;
}
/* الأسئلة الأكثر تكراراً للخطأ عبر كل محاولاتك (وليس فقط آخر امتحان) — يختلف عن «أخطائي في الامتحان» الذي يعرض آخر خطأ فقط */

  stopSpeak(); window.scrollTo(0,0);

  if(!qs.length){
    app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="back">‹ الاختبار</button></div>'+

    return $('#back').onclick=viewExam;

  app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="back">‹ الاختبار</button></div>'+

   '<div class="note" style="text-align:right">'+qs.length+' سؤالاً أخطأت فيها مرتين أو أكثر عبر كل محاولاتك — هذه أهم أسئلة تحتاج إتقانها فعلياً.</div>'+
   '<button class="btn gold wide" id="go" style="margin-top:14px">ابدأ ('+Math.min(30,qs.length)+' سؤالاً)</button></section>';
  $('#back').onclick=viewExam;
  $('#go').onclick=()=>examQuiz(shuffle(qs).slice(0,30),'الأسئلة الأكثر تكراراً للخطأ',()=>viewExam(),{});
}

/* كلمات قابلة للنقر لعرض معناها — تُستخدم في نصوص أسئلة الاختبار وخياراتها */
function tapWords(text){
  return String(text).split(' ').map(w=>'<span class="w" data-word="'+esc(w)+'">'+esc(w)+'</span>').join(' ');
}
/* تنظيف نص سؤال الامتحان قبل نطقه — يُبقي سطر A فقط في المحادثات ويحذف علامة الفراغ B: ______ */
function examSpeakText(t){
  let s=String(t).split('\n')[0];
  s=s.replace(/^[AB]:\s*/,'');
  return s.trim();
}

  const picks=new Array(qs.length).fill(null);
  const flagged=new Array(qs.length).fill(false);
  function fmtTime(s){ const m=Math.floor(s/60),ss=s%60; return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss; }
  function updateTimerUI(){
    const el=document.getElementById('examTimer');
    if(!el) return;
    if(opt.timeLimit){ el.textContent='⏱ '+fmtTime(Math.max(0,timeLeft)); el.style.color=timeLeft<=300?'var(--plum)':''; }
    else { el.textContent='⏱ '+fmtTime(elapsed); el.style.color=''; }
  }
  function startTimer(){
    if(timerInt) return;
    timerInt=setInterval(()=>{
      elapsed++;
      if(opt.timeLimit){
        timeLeft--; updateTimerUI();
        if(timeLeft<=0){ clearInterval(timerInt); timerInt=null; ACTIVE_EXAM_TIMER=null; timedOut=true; finalize(); return; }
      } else updateTimerUI();
    },1000);
    ACTIVE_EXAM_TIMER=timerInt;
  }
  /* يحسب النتيجة النهائية من مصفوفة picks — تُستخدم فقط في وضع التصفّح (NAV) */
  function finalize(){
    right=0; wrong=[]; answers=[];
    S.qStatus=S.qStatus||{};
    qs.forEach((q,idx)=>{
      const n=picks[idx];
      if(n==null){ answers.push({q:q,pick:null,ok:false}); wrong.push(q); return; }
      const ok=n===q._a;
      answers.push({q:q,pick:q._o[n],ok:ok});
      if(q._id){ S.qStatus[q._id]=ok?'correct':'wrong'; if(!ok){ S.qMiss=S.qMiss||{}; S.qMiss[q._id]=(S.qMiss[q._id]||0)+1; } }
      if(ok) right++; else { wrong.push(q); if(!S.examWrong.some(x=>x.q===q.q)) S.examWrong.push({q:q.q,o:q.o,a:q.a}); }
    });
    done();
  }
  function draw(){
    if(!NAV && i>=qs.length) return done();
    const q=qs[i];
    if(!q._o){ const ix=shuffle(q.o.map((_,n)=>n)); q._o=ix.map(n=>q.o[n]); q._a=ix.indexOf(q.a); }
    const navBar=NAV?('<div class="row" style="margin-top:10px;gap:6px">'+
      '<button class="btn sm ghost" id="ovBtn">🔢 نظرة عامة</button>'+
      '<button class="btn sm '+(flagged[i]?'gold':'ghost')+'" id="flagBtn">'+(flagged[i]?'🚩 معلَّم':'🚩 علّم للمراجعة')+'</button></div>'):'';
    app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="quit">‹ خروج</button></div>'+
    '<section class="sheet"><div class="qhead"><span class="qcount">'+(i+1)+'/'+qs.length+'</span>'+
    '<span id="examTimer" style="font-weight:800;font-size:13px;margin-inline-start:8px;background:var(--gold,#B9862F);color:#fff;padding:3px 10px;border-radius:99px;white-space:nowrap;flex-shrink:0"></span>'+
    '<span class="pbar"><i style="width:'+Math.round((NAV?i:i)/qs.length*100)+'%"></i></span></div>'+
    (function(){ const tp=tipFor(q,title); return '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
      '<span class="qtype">'+esc(title)+'</span>'+(tp?'<button class="btn ghost sm" id="tipBtn" style="padding:2px 10px;font-size:12px">💡 كيف أجيب؟</button>':'')+'</div>'+
      (tp?'<div class="note tip-panel" id="tipPanel" style="display:none;margin:8px 0">💡 '+esc(tp)+'</div>':''); })()+
    '<div class="qtext en" style="display:flex;align-items:flex-start;gap:8px">'+
      '<button class="icobtn" id="qSay" style="flex-shrink:0" title="استمع">🔊</button>'+
      '<span style="flex:1">'+tapWords(q.q)+'</span></div>'+
    '<div class="qhint">اضغط أي كلمة لمعناها، أو 🔊 للاستماع</div>'+
    (opt.texts?'<button class="btn ghost sm" id="showT" style="margin-bottom:10px">📖 أظهر القطع</button>':'')+
    '<div class="opts">'+q._o.map((o,n)=>{
      let cls=(NAV&&picks[i]===n?' sel':'');
      if(NAV&&picks[i]!=null){ if(n===q._a) cls+=' ok'; else if(n===picks[i]) cls+=' no'; }
      const dis=(NAV&&picks[i]!=null)?' disabled':'';
      return '<button class="opt'+cls+'" data-n="'+n+'"'+dis+'><span class="en">'+tapWords(o)+'</span></button>';
    }).join('')+'</div>'+
    (NAV&&picks[i]!=null?(function(){ const okNow=picks[i]===q._a; return '<div class="fb '+(okNow?'ok':'no')+'">'+
      (okNow?'✅ إجابة صحيحة':'❌ إجابة خاطئة — الصحيحة: <span class="en">'+esc(q.o[q.a])+'</span>')+
      (q.exp?'<div class="fb-exp">'+esc(q.exp)+'</div>':'')+'</div>'; })():'')+
    navBar+
    (NAV?'<div class="row" style="margin-top:10px;gap:8px">'+
      '<button class="btn" id="prevBtn" style="flex:1"'+(i===0?' disabled':'')+'>‹ السابق</button>'+
      '<button class="btn gold" id="nextBtn" style="flex:1">'+(i===qs.length-1?'مراجعة وتسليم ›':'التالي ›')+'</button></div>':'')+
    '</section>';
    $('#quit').onclick=()=>{ if(timerInt){ clearInterval(timerInt); timerInt=null; } ACTIVE_EXAM_TIMER=null; viewExam(); };
    updateTimerUI(); startTimer();
    if($('#qSay')) $('#qSay').onclick=()=>speak(examSpeakText(q.q),{rate:Math.min(S.rate,0.8)});
    app.querySelectorAll('.qtext .w, .opts .w').forEach(w=>w.onclick=e=>{ e.stopPropagation(); wordPopup(w.dataset.word); });
    if($('#tipBtn')) $('#tipBtn').onclick=()=>{
      const p=$('#tipPanel'); p.style.display=p.style.display==='none'?'block':'none';
    };
    if($('#showT')) $('#showT').onclick=()=>{
      const s=app.querySelector('.sheet');
      if(s.querySelector('.pt')) return s.querySelector('.pt').remove();
      const d=document.createElement('div'); d.className='note pt';
      d.style.cssText='margin-top:10px;max-height:240px;overflow:auto';
      d.innerHTML=opt.texts.map(t=>'<div class="exp-text" style="font-family:var(--en);direction:ltr;text-align:left;font-size:13px;line-height:1.7;margin-bottom:10px">'+esc(t)+'</div>').join('');
      s.appendChild(d);
    };
    if(NAV){
      if($('#ovBtn')) $('#ovBtn').onclick=()=>drawOverview();
      if($('#flagBtn')) $('#flagBtn').onclick=()=>{ flagged[i]=!flagged[i]; draw(); };
      if($('#prevBtn')) $('#prevBtn').onclick=()=>{ if(i>0){ i--; draw(); } };
      if($('#nextBtn')) $('#nextBtn').onclick=()=>{ if(i<qs.length-1){ i++; draw(); } else drawOverview(); };
    }
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const n=+b.dataset.n;
      if(NAV){ if(picks[i]!=null) return; picks[i]=n; if(n===q._a) addXP(2); draw(); return; }
      const ok=n===q._a;
      answers.push({q:q,pick:q._o[n],ok:ok});
      if(q._id){ S.qStatus=S.qStatus||{}; S.qStatus[q._id]=ok?'correct':'wrong'; if(!ok){ S.qMiss=S.qMiss||{}; S.qMiss[q._id]=(S.qMiss[q._id]||0)+1; } }
      if(ok) right++; else {
        wrong.push(q);
        if(!S.examWrong.some(x=>x.q===q.q)) S.examWrong.push({q:q.q,o:q.o,a:q.a});
      }
      app.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(+x.dataset.n===q._a)x.classList.add('ok');});
      if(!ok) b.classList.add('no');
      if(ok) addXP(5);
      const s=app.querySelector('.sheet');
      const d=document.createElement('div'); d.className='fb '+(ok?'ok':'no');
      d.innerHTML=(ok?'✅ إجابة صحيحة':'❌ إجابة خاطئة — الصحيحة: <span class="en">'+esc(q.o[q.a])+'</span>')+
        (q.exp?'<div class="fb-exp">'+esc(q.exp)+'</div>':'');
      s.appendChild(d);
      const nb=document.createElement('button'); nb.className='btn '+(ok?'gold':'')+' wide';
      nb.style.marginTop='12px'; nb.textContent='التالي ›';
      nb.onclick=()=>{i++;save();draw();}; s.appendChild(nb);
    });
  }
  /* شاشة نظرة عامة — شبكة بأرقام الأسئلة ملوّنة حسب الحالة، مع زر تسليم نهائي (وضع التصفّح فقط) */
  function drawOverview(){
    if(timerInt){ } // keep timer running during overview
    const answeredN=picks.filter(p=>p!=null).length;
    const flaggedN=flagged.filter(Boolean).length;
    app.innerHTML='<div style="padding-top:14px"><button class="btn sm" id="quit">‹ خروج</button></div>'+
    '<section class="sheet"><h2 style="font-size:17px">🔢 نظرة عامة على الامتحان</h2>'+
    '<div style="margin:6px 0"><span id="examTimer" style="font-weight:800;font-size:14px;background:var(--gold,#B9862F);color:#fff;padding:4px 12px;border-radius:99px"></span></div>'+
    '<div class="note">أجبت '+answeredN+' من '+qs.length+' — معلَّم للمراجعة: '+flaggedN+'. اضغط أي رقم للانتقال إليه مباشرة.</div>'+
    '<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px">'+
    qs.map((q,idx)=>{
      const st=picks[idx]!=null?'answered':'unanswered';
      const bg=flagged[idx]?'#B9862F':(st==='answered'?'var(--leaf)':'#3A2E22');
      const bd=flagged[idx]?'#B9862F':(st==='answered'?'var(--leaf)':'#6E5B45');
      return '<button class="btn sm" data-jump="'+idx+'" style="background:'+bg+';border:1px solid '+bd+';color:#fff">'+(idx+1)+'</button>';
    }).join('')+
    '</div>'+
    '<div class="row" style="margin-top:16px;gap:8px">'+
    '<button class="btn" id="backQ" style="flex:1">‹ عودة للسؤال</button>'+
    '<button class="btn gold" id="submitAll" style="flex:1">تسليم الامتحان نهائياً</button></div>'+
    '</section>';
    $('#quit').onclick=()=>{ if(timerInt){ clearInterval(timerInt); timerInt=null; } ACTIVE_EXAM_TIMER=null; viewExam(); };
    updateTimerUI();
    $('#backQ').onclick=()=>draw();
    app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{ i=+b.dataset.jump; draw(); });
    $('#submitAll').onclick=()=>{
      const unanswered=picks.filter(p=>p==null).length;
      if(unanswered>0 && !confirm('لديك '+unanswered+' سؤالاً بلا إجابة. هل تريد التسليم الآن؟')) return;
      finalize();
    };
  }
    function done(){
    if(timerInt){ clearInterval(timerInt); timerInt=null; } ACTIVE_EXAM_TIMER=null;
    const pct=Math.round(right/Math.max(1,qs.length)*100);
    const E=examStats();
    if(title.indexOf('قواعد')>=0){ E.gram.seen+=qs.length; E.gram.right+=right; }
    if(opt.clearWrong) S.examWrong=wrong.map(q=>({q:q.q,o:q.o,a:q.a}));
    save();
    let secHTML='';
    let bySecForLog=null;
    if(opt.sections){
      const bySec={};
      answers.forEach(a=>{ const s=a.q._sec||'عام'; bySec[s]=bySec[s]||{r:0,t:0}; bySec[s].t++; if(a.ok)bySec[s].r++; });
      bySecForLog=bySec;
      const secOrder=Object.keys(bySec);
      secHTML='<h2 style="margin-top:16px"><i>📊</i> النتيجة حسب القسم</h2>'+
        secOrder.map(s=>{ const d=bySec[s]; const p=Math.round(d.r/Math.max(1,d.t)*100);
          return '<div class="note" style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">'+
            '<span>'+esc(s)+'</span><span style="font-weight:700;color:'+(p>=60?'var(--leaf)':'var(--plum)')+'">'+d.r+'/'+d.t+' ('+p+'٪)</span></div>';
        }).join('');
    }
    logAttempt({ title:title, right:right, total:qs.length, pct:pct, elapsed:elapsed, timedOut:!!timedOut, sections:bySecForLog });
    const timeNote=(timedOut?'<div class="note" style="margin-top:10px;color:var(--plum)">⏱ انتهى الوقت المخصص — تم تسليم الامتحان تلقائياً كما يحدث في الاختبار الحقيقي.</div>':'');
    const elapsedNote='<div class="note" style="margin-top:10px">⏱ الوقت المستغرق: '+fmtTime(elapsed)+(opt.timeLimit?' من أصل '+fmtTime(opt.timeLimit):'')+'</div>';
    const passNote=(opt.passNote?'<div class="note" style="margin-top:10px">'+esc(opt.passNote)+'</div>':'');
    app.innerHTML='<section class="sheet" style="margin-top:26px"><div class="score">'+
     '<div class="big" style="color:'+(pct>=60?'var(--leaf)':'var(--plum)')+'">'+pct+'٪</div>'+
     '<div class="lab">'+right+' صحيحة من '+qs.length+'</div></div>'+
     '<div class="note" style="margin-top:12px">'+
     (pct>=80?'مستوى ممتاز — أنت جاهز لهذا النمط من الأسئلة.':
      pct>=60?'مستوى مقبول. راجع أخطاءك أدناه ثم أعد بعد يومين.':
      'تحتاج مراجعة. ابدأ بقسم «أخطائي في الامتحان».')+'</div>'+
     timeNote+elapsedNote+passNote+secHTML+
     (wrong.length&&TIPS.mistakes[title]?'<div class="note" style="margin-top:14px"><b>💡 أنماط الأخطاء الشائعة في هذا القسم:</b><br>'+esc(TIPS.mistakes[title])+'</div>':'')+
     (NAV?
       /* وضع التصفّح (الامتحان التجريبي/التشخيصي): مراجعة كاملة لكل الأسئلة — صحيحة وخاطئة — مع السبب لكل واحدة */
       ('<h2 style="margin-top:16px"><i>📋</i> مراجعة كاملة لكل الأسئلة ('+answers.length+')</h2>'+
       answers.map((a,idx)=>'<div class="ul-item" style="display:block;border-inline-start:3px solid '+(a.ok?'var(--leaf)':'var(--plum)')+'">'+
         '<div style="display:flex;justify-content:space-between;align-items:center">'+
         '<span style="font-size:11.5px;color:var(--muted)">سؤال '+(idx+1)+'</span>'+
         '<span style="font-size:12px;font-weight:700;color:'+(a.ok?'var(--leaf)':'var(--plum)')+'">'+(a.ok?'✅ إجابة صحيحة':(a.pick==null?'⬜ بلا إجابة':'❌ إجابة خاطئة'))+'</span></div>'+
         '<div class="e" style="font-family:var(--en);direction:ltr;text-align:left;font-size:14px;font-weight:600;margin-top:4px">'+esc(a.q.q)+'</div>'+
         (a.pick!=null&&!a.ok?'<div style="font-size:12.5px;margin-top:6px;color:#6E2A3F">❌ إجابتك: <span class="en">'+esc(a.pick)+'</span></div>':'')+
         (a.pick==null?'<div style="font-size:12.5px;margin-top:6px;color:#6E2A3F">لم تُجب عن هذا السؤال</div>':'')+
         '<div style="font-size:12.5px;color:#14503F;margin-top:'+(a.ok?'6px':'2px')+'">✅ الإجابة الصحيحة: <span class="en">'+esc(a.q.o[a.q.a])+'</span></div>'+
         (a.q.exp?'<div class="fb-exp">💡 '+esc(a.q.exp)+'</div>':'')+'</div>').join(''))
      :(wrong.length?'<h2 style="margin-top:16px"><i>✗</i> مراجعة الأخطاء ('+wrong.length+')</h2>'+
       answers.filter(a=>!a.ok).map(a=>'<div class="ul-item" style="display:block">'+
         '<div class="e" style="font-family:var(--en);direction:ltr;text-align:left;font-size:14px;font-weight:600">'+esc(a.q.q)+'</div>'+
         '<div style="font-size:12.5px;margin-top:6px;color:#6E2A3F">❌ إجابتك: <span class="en">'+esc(a.pick)+'</span></div>'+
         '<div style="font-size:12.5px;color:#14503F">✅ الصحيح: <span class="en">'+esc(a.q.o[a.q.a])+'</span></div>'+
         (a.q.exp?'<div class="fb-exp">'+esc(a.q.exp)+'</div>':'')+'</div>').join('')
       :''))+
     '<div class="row" style="margin-top:14px;gap:8px">'+
     (wrong.length?'<button class="btn gold" id="rw" style="flex:1">أعد الأخطاء</button>':'')+
     '<button class="btn" id="b" style="flex:1">تم</button></div></section>';
    if($('#rw')) $('#rw').onclick=()=>examQuiz(wrong.map(q=>{const c=Object.assign({},q);delete c._o;delete c._a;return c;}),title,onDone,Object.assign({},opt,{timeLimit:0,sections:false,passNote:''}));
    $('#b').onclick=()=>{ if(onDone) onDone(pct); else viewExam(); };
  }
  draw();
}

</script></body></html>
